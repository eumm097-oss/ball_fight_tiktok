<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<title>볼 파이트 틱톡</title>
<style>
:root{--bg:#fff;--ink:#000;--left:#4a4f52;--right:#2f9e5b;--bar:#2fc455;--bar-text:#fff;--rail:#c8cbcc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.stage{position:relative;display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh}
.wrap{width:100%;max-width:560px;padding:12px 16px 8px;transform:translateY(-3vh)}
.arena{aspect-ratio:1/1;width:100%;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;background:var(--bg)}
.arena{position:relative;align-items:flex-start;overflow:visible}
.start{position:relative;width:50%;height:38px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:clamp(15px,4.5vw,21px);letter-spacing:.04em;font-family:inherit;line-height:1;padding:0 0 calc(var(--shift,.05)*2em);color:#fff;background:var(--bar);border:2px solid var(--ink);border-radius:5px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);text-shadow:0 1px 0 rgba(0,0,0,.25);cursor:pointer}
.start::before{content:'';flex:none;width:.62em;height:.8em}
.start::after{content:'';flex:none;width:0;height:0;border-left:.62em solid #fff;border-top:.4em solid transparent;border-bottom:.4em solid transparent}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:calc((min(100vw,560px) - 40px)*.085);font-weight:700;color:var(--ink);line-height:1;padding:0 0 calc(var(--shift,.05)*2em);pointer-events:none;z-index:6}
.start[hidden],.end[hidden]{display:none}
.start:active{transform:scale(.96)}
.start:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.name{font-size:clamp(22px,6.5vw,34px);font-weight:900;margin-bottom:2px;height:28px;display:flex;align-items:center}
.p2 .name{justify-content:flex-end}
.add{height:28px;width:100%;padding:0;font-family:inherit;font-weight:400;font-size:clamp(13px,3.9vw,19px);color:#fff;background:#5f6467;border:2px solid var(--ink);border-radius:0;cursor:pointer}
.add:disabled{cursor:default}
.add:active:not(:disabled){transform:scale(.96)}
.add:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.p2 .name{text-align:right;color:var(--right)}
.p1 .name{color:var(--left)}
.hp{height:26px;background:linear-gradient(to right,var(--bar) var(--g,100%),transparent var(--g,100%)),linear-gradient(to right,#a2ffb7 var(--l,100%),transparent var(--l,100%)),linear-gradient(to right,#e03131 var(--r,100%),var(--rail) var(--r,100%));border:2px solid var(--ink);color:var(--bar-text);display:flex;align-items:center;justify-content:center;font-size:clamp(12px,3.6vw,17px)}
.rail{height:7px;margin-top:4px}
.p1 .rail{background:var(--rail)}
.p2 .rail{background:var(--rail)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal[hidden]{display:none}
.codebox{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.codecard{width:min(320px,100%);background:#fff;color:#111;border:2px solid #000;border-radius:14px;padding:18px 16px 14px}
.codemsg{margin:0 0 12px;font-size:14px;line-height:1.6;font-weight:700;text-align:center}
.codein{width:100%;box-sizing:border-box;padding:10px 12px;border:2px solid #000;border-radius:10px;font:700 18px/1 inherit;text-align:center;letter-spacing:.3em}
.codeerr{min-height:18px;margin:6px 0 8px;font-size:12.5px;color:#e02424;text-align:center}
.coderow{display:flex;gap:8px}.coderow button{flex:1;padding:10px 0;border:2px solid #000;border-radius:10px;background:#fff;font:700 14px/1 inherit;color:#111;cursor:pointer}.coderow .codeyes{background:#111;color:#fff}
.panel{position:relative;width:100%;max-width:560px;min-height:min(70vh,480px);background:var(--bg);border:3px solid var(--ink);padding:56px 20px 28px}
.dummy-row{margin-bottom:12px}
.dummy-row .half{width:calc(50% - 6px)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns .half:last-child:nth-child(odd):not(:first-child){grid-column:1/-1;justify-self:center;width:calc(50% - 6px)}
.close{position:absolute;top:8px;right:8px;width:36px;height:36px;font-size:20px;line-height:1;color:var(--ink);background:transparent;border:2px solid var(--ink);cursor:pointer}
.half{width:100%;height:34px;color:#fff;font-family:inherit;font-size:clamp(15px,4.5vw,22px);background:#505558;border:2px solid var(--ink);border-radius:0;cursor:pointer}
.half[data-locked]{background:#3a3e40;color:#8d9396;filter:brightness(.8)}
.half .lk{width:.95em;height:.95em;margin-right:.35em;flex:none}
.mtoast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#1f2224;color:#fff;border:2px solid var(--ink);padding:9px 14px;font-size:clamp(13px,3.8vw,16px);white-space:nowrap;z-index:5;pointer-events:none}
.half:active,.close:active{transform:scale(.96)}
.close:focus-visible,.half:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ball{position:absolute;top:50%;width:14%;aspect-ratio:1/1;border-radius:50%;transform:translate(-50%,-50%);background:#bfe8cc;border:4px solid #1f6b43}
.ball.left{left:25%}.ball.right{left:75%}
.ball.dummy{background:#d5d8da;border-color:#CD2E3A}
.ball.dummy .aim i{background:#CD2E3A}
.pname{color:#2f9e5b;font-weight:500;font-size:calc(min(100vw,560px)*.046 - 1.5px);line-height:1;letter-spacing:-.01em;white-space:nowrap;text-shadow:-.5px 0 #000,.5px 0 #000,0 -.5px #000,0 .5px #000,-.5px -.5px #000,.5px -.5px #000,-.5px .5px #000,.5px .5px #000}
.pname.sys{color:var(--left)}
.aim{position:absolute;inset:0;opacity:0}
.aim i{position:absolute;left:calc(100% + 4px);top:50%;width:36%;height:4px;margin-top:-2px;background:#2f9e5b;border-radius:3px}
.add,.half,.hp{display:flex;align-items:center;justify-content:center;line-height:1;padding:0 0 calc(var(--shift,.05)*2em)}
.pname{padding-bottom:calc(var(--shift,.05)*2em)}
.ball.nm{background:#fff var(--img-nm) center/cover no-repeat}
.hud>div:not(.on) .hp,.hud>div:not(.on) .rail{visibility:hidden}
.end-row{display:flex;justify-content:center;margin-top:46px}
.end{position:relative;width:50%;height:38px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:clamp(15px,4.5vw,21px);letter-spacing:.04em;font-family:inherit;line-height:1;padding:0 0 calc(var(--shift,.05)*2em);color:#fff;background:#d32f2f;border:2px solid var(--ink);border-radius:5px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22);text-shadow:0 1px 0 rgba(0,0,0,.3);cursor:pointer}
.end::before{content:'';flex:none;width:1.4em;height:1.4em}
.end::after{content:'';flex:none;width:1.4em;height:1.4em;background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAACgCAYAAACLz2ctAAAMAElEQVR42u2dC7BVVRnHv2tAPnlkZj4DSdAsNS0VaeQSJmVZaQ8TR7qavaAczQdOqVFqoqBZocZNmrJUJh2xktIEuyKkzUABWhkEURhm5gNQuIhy+v6tdede7j1n77X32Ws//7+ZbwbOXXuffdb5n/X81ve11Go1ISQrdmIVEAqQUICEUICEAiSEAiSVoV9BnnMftX3tv19QG+L5/Y5K4D0OVDvYsewtavdSgIY3ql2oNqLJe0MwhyT0nLuq9S95T0QBWiaqTWHnkCqr2AV3szP1kBhb1ZapdaitV7vc9jC96aQASRLUbGsGwc1Ve0xtQ4+/n6J2IquJAkySJ9Uet6LDOO7pGPcYRgHu+CsmjUGL9oDaCtvKPRmhznZv8PpBFGA3i6ixPuO4dWoPq81T+43a5pj3OpbVGS7Ad7FaZKPaz+2P8ddqTyUoZk7yQgS4SwXr4VW1hWoP2u71r2pbPI0Xj6TsOAkBa2wrh8nDYrXnU3jPQZRcdQW4Wu0JO3HosOO6tCdc+1Fy1RHgS2rz7eShw85as57hP6o2hrIrpwBfsV/wXCu2pWqbcvaM2yi5cgpwpdrJdlxHKMDU6fAgvgPUDlcbLd3ba3+nZPwLcG2F66NF7UwxTgP1fPmwPniNWrsYv0TSJDs1mC1WEQhugdpt0tiRdKAV4HK191I+fgRYRUapPaLW6lh+f7X71S5l1VGAzQJPFGy3vSnG8OVbaiewCinAZphuu9a4zJZyHxegAD1yhNppTd5juNp7KCUKMA6tCd3nDEqJAoxDUttix1NKFGAc9qYEKMAsP/uBlAAFmBXbxbhkJcFrlBIFGIcNCd3nV5QSBRiH2Qndp51SSk6Aoyv0+X8hze994ywwvWQSFGCVTm3BibVNzGm1OCDcxmTKiF1wM+BA0vlWjFHFN1biRUIgFOAOzFL7sLgfOIdosYi9ilVHASYFIh6MVJup9mydv3da4Z1hxbeaVdY8DE60I/9SO0/tYrW3SXeQThxcxwm7Dawi/wLcymr5fx380RpJuQtezGohWbaADM/m78e+Z4O/IWICTuFhaxD+hftHuC9a6Y0cA1aDvdQ+aMVyaICguoCj6gD775aASd8bxJxGxP706yI+E8anP1G7Ugp4opECdGeS2nViIvb7oCWG+Lq+w7PVxtkfx5+KPgYkfUHrMtOj+JIArmV3SuMorIUR4HHU2w4cLcVJW/F2ta8UXYC7UXN9ut4iDVW+LgU6IsAuOJzWgj0vxpLfKcp3SwEGg+WRIqZQwLDhEgqw+BR5lQDj1rewgokLCC23RO0ZMWGEw0Ag+QtCBIZ41AgdciYFSMJ42golyuEmCPYRO+ZrBDx37pIcZ+JkF5wPcAziUxGv+Z3aDQ7lZkiOvdwpwPxwo9oeEa+5TExOkyCQBuwaCpCEgX3laRGvgdtYm4Qn1fmS2mEUIAnjXImeuPD3Yhafg8Ae8+w8jvkpwHyBOIOzYlyHheeVIWWOUfssBUjCgFfL2IjXIP8IPGJeDSl3rXQfM6AA+Tka0h7jMyFJz/dCysBTZgq/uOQpW4RSeEXHCYDuMitGSzmBAkx+7FQ2LhLjKR0FzIbPkfAFbcTFHkIBloNlnu47WNwWmut1xdeGlNlH7dsUYDmA58kST/eeEHPSgExPfwkpc5bkwPmYAmyemh3Y+whS2S9mS4Vnwpri9oAy2EP+fNaVR2cEs0PQr8EXdK7jPX4rJk3sxz083wfUPiImu3vUrvh6MVEe6gFHhsy36FpqtT7HgL+qdlXBRIQ4LY3yu2FnAXFfBjXoAZodjHf1Iu8Qc0bXR6+yVswx0KhRK3C8YqUd83WBHMpwVm2XHJwBr0IXfKQV4Z51LMmZ4 .end:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.rail{overflow:hidden}
.rail .fill{display:block;width:100%;height:100%;background:#2f9e5b;transform-origin:left center;transform:scaleX(0)}

:root{--W:calc(min(100vw,560px) - 40px)}
.hp{font-weight:500;text-shadow:-.3px 0 #000,.3px 0 #000,0 -.3px #000,0 .3px #000,-.3px -.3px #000,.3px -.3px #000,-.3px .3px #000,.3px .3px #000}
.hud>div{position:relative}
.hud .rail{background:transparent;position:relative;overflow:visible}
.rb{position:absolute;left:0;right:0;top:50%;height:7px;border:1px solid var(--ink);box-sizing:border-box;transform:translateY(-50%);background:var(--rail);overflow:visible;transition:background .2s}
.rb .fill{position:absolute;inset:0;width:auto;height:auto;background:#2f9e5b;transform-origin:left center;transform:scaleX(0)}
.rail.boost .rb{background:#26354f;box-shadow:0 0 0 1px #3b82f6,0 0 10px 3px rgba(59,130,246,.75);animation:bpulse .5s ease-in-out infinite alternate}
@keyframes bpulse{to{box-shadow:0 0 0 1px #60a5fa,0 0 16px 6px rgba(59,130,246,.95)}}
.num{display:none;position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:9px;font-weight:700;line-height:1;z-index:1;text-shadow:0 0 2px #000,0 0 2px #000}
.rail.boost .num{display:block}
.status{position:absolute;top:100%;margin-top:7px;color:#3b82f6;font-weight:700;font-size:calc(var(--W)/2*.056);white-space:nowrap;line-height:1.2}
.status{left:0;right:0;text-align:center}
.fxlayer{position:absolute;inset:0;pointer-events:none;z-index:5}
.fxlayer>*{position:absolute}
.tag{transform:translate(-50%,-100%);color:#2f9e5b;font-weight:700;font-size:calc(var(--W)*.04);white-space:normal;text-align:center;width:max-content;max-width:calc(var(--W)*.34);line-height:1.1;text-shadow:0 0 2px var(--bg),0 0 3px var(--bg)}
.bang{transform:translate(-50%,-50%);color:#e02424;font-weight:900;font-size:calc(var(--W)*.1);line-height:1}
.ringw{width:calc(var(--W)*.14);height:calc(var(--W)*.14);transform:translate(-50%,-50%)}
.ring{position:absolute;inset:-4px;border:2px solid #e02424;border-radius:50%;animation:aimin .175s ease-in forwards;
background:linear-gradient(#e02424,#e02424) 50% 0/2px 9px no-repeat,linear-gradient(#e02424,#e02424) 50% 100%/2px 9px no-repeat,linear-gradient(#e02424,#e02424) 0 50%/9px 2px no-repeat,linear-gradient(#e02424,#e02424) 100% 50%/9px 2px no-repeat}
@keyframes aimin{from{transform:scale(2.6);opacity:.2}to{transform:scale(1);opacity:1}}
.dist{transform:translate(-50%,-100%);color:#e02424;font-weight:700;font-size:calc(var(--W)*.034);line-height:1;white-space:nowrap}
.shot{height:3px;background:#e02424;transform-origin:0 50%}
.frag{width:9px;height:6px;border-radius:5px 5px 5px 1px}
.popring{border:3px solid #1f6b43;border-radius:50%;box-sizing:border-box}
.count.win{font-size:calc(var(--W)*.062)}
.count .wt{white-space:nowrap;text-shadow:0 0 6px var(--bg),0 0 3px var(--bg)}
.crown{transform:translate(-50%,-100%);width:calc(var(--W)*.077)}
.crown svg{display:block;width:100%;height:auto}
.pring{border-style:solid;border-radius:50%;box-sizing:border-box;transform:translate(-50%,-50%)}
.spk{border-radius:2px}
.glow{border-radius:50%;transform:translate(-50%,-50%)}
.dmg{transform:translate(-50%,-100%);color:#e02424;font-weight:700;font-size:calc(var(--W)*.028);line-height:1;white-space:nowrap}
.ball.jy{background:#fff var(--img-jy) center/cover no-repeat;border-color:#d9561f}
.ball.jy .aim i{background:#f26b35}
.pname.jy{color:#f26b35}
.ball.t1{box-shadow:0 0 0 3px #3b82f6}
.ball.t2{box-shadow:0 0 0 3px #e5484d}
.tm{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);font-style:normal;font-weight:700;font-size:calc(var(--W)*.026);line-height:1;color:#fff;padding:2px 5px;border-radius:8px;white-space:nowrap}
.tm.t1,.tbadge.t1{background:#3b82f6}
.tm.t2,.tbadge.t2{background:#e5484d}
.p1 .tbadge{margin-right:0;margin-left:5px}
.tbadge{display:inline-block;font-size:.5em;font-weight:700;color:#fff;padding:2px 5px;border-radius:7px;margin-right:5px;vertical-align:middle;line-height:1.1}
.muzzle{width:calc(var(--W)*.075);height:calc(var(--W)*.075);margin:calc(var(--W)*-.0375) 0 0 calc(var(--W)*-.0375);border-radius:50%;background:radial-gradient(circle,#fff 0%,#ffe27a 40%,rgba(255,170,40,0) 72%)}
.tracer{left:0;top:0;width:calc(var(--W)*.09);height:3px;margin-top:-1.5px;border-radius:2px;transform-origin:0 50%;background:linear-gradient(to right,rgba(255,226,122,0),#fff6c2 70%,#fff)}
.impact{width:calc(var(--W)*.1);height:calc(var(--W)*.1);margin:calc(var(--W)*-.05) 0 0 calc(var(--W)*-.05);border-radius:50%;background:radial-gradient(circle,#fff 0%,#ffd24a 45%,rgba(255,120,30,0) 75%)}
.spark{width:2px;height:calc(var(--W)*.026);border-radius:2px;background:#ffd24a}
.tag.tagimg{max-width:none}

.more{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:none;border:0;padding:8px 14px;font:500 13px/1 "IBM Plex Sans KR","Noto Sans KR",sans-serif;color:#666;cursor:pointer}
.guide{width:100%;max-width:560px;margin:0 auto;padding:28px 16px calc(64px + env(safe-area-inset-bottom,0px));font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#111;-webkit-font-smoothing:antialiased}
.guide h2{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.guide .sub{margin:0 0 18px;font-size:13px;line-height:1.5;color:#666}
.gcard{position:relative;border:1.5px solid #000;border-radius:14px;padding:16px;margin:0 0 14px;background:#fff}
.ghead{display:flex;align-items:center;gap:12px}
.av{flex:none;width:58px;height:58px;border-radius:50%;border:3px solid var(--c);background:#d5d8da center/cover no-repeat}
.av.nm{background:#fff var(--img-nm) center/cover no-repeat}
.av.jy{background:#fff var(--img-jy) center/cover no-repeat}
.gname{font-size:20px;font-weight:700;line-height:1.2;color:var(--c)}
.gtag{margin-top:3px;font-size:13px;line-height:1.4;color:#555}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.chip{border:1px solid #000;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;line-height:1.4}
.skills{margin-top:10px}
.sk{padding:11px 0 3px;border-top:1px solid #e6e6e6}
.skh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.skn{font-size:15px;font-weight:700}
.skp{flex:none;border-radius:999px;background:#111;padding:2px 9px;font-size:12px;font-weight:700;color:#fff}
.skd{margin:5px 0 0;font-size:13.5px;line-height:1.6;color:#333}
.noskill{margin:12px 0 2px;padding-top:11px;border-top:1px solid #e6e6e6;font-size:13.5px;color:#666}
.rm{flex:none;background:none;border:0;padding:0 7px;font-family:inherit;font-weight:700;font-size:calc(min(100vw,560px)*.06);line-height:1;color:#9aa0a3;cursor:pointer}
.p1 .rm{margin-left:2px}.p2 .rm{margin-right:2px}
.rm:active{color:#5f6467}
.food{font-size:calc(var(--W)*.08);line-height:1;transform:translate(-50%,-50%);user-select:none}
.table{width:calc(var(--W)*.11)}
.fork{width:calc(var(--W)*.075);transform:translate(-50%,-100%)}
.table svg,.fork svg{display:block;width:100%;height:auto}
.ball.fast{filter:drop-shadow(0 0 4px rgba(255,176,46,.8)) drop-shadow(0 0 7px rgba(255,140,0,.45))}
.ball.strong{filter:drop-shadow(0 0 4px rgba(255,59,48,.8)) drop-shadow(0 0 7px rgba(255,59,48,.42))}
.ball.fast.strong{filter:drop-shadow(0 0 4px rgba(255,176,46,.75)) drop-shadow(0 0 4px rgba(255,59,48,.65)) drop-shadow(0 0 8px rgba(255,80,40,.4))}
.guide .h3{margin:30px 0 6px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.guide .h3.first{margin-top:12px}
.fxic{flex:none;display:flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:14px;border:2px solid var(--c);font-size:25px;line-height:1;background:#fff}
.fxsrc{margin:8px 0 0;font-size:12.5px;line-height:1.5;color:#666}
.fxtoggle{position:absolute;top:6px;right:6px;display:flex;align-items:center;justify-content:center;width:48px;height:42px;padding:0;border:0;border-radius:10px;background:none;color:#111;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fxtoggle svg{width:24px;height:10px;transition:transform .26s ease}
.fxtoggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.fxtoggle:active{background:#f0f0f0}
.fxtoggle:focus-visible{outline:2px solid #111;outline-offset:-2px}
.fxhint{margin:6px 0 0;font-size:12px;line-height:1.5;color:#999}
.fxsub{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .26s ease,visibility 0s .26s}
.fxsub.open{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .26s ease,visibility 0s 0s}
.fxsub>div{min-height:0;overflow:hidden}
.skr{display:flex;align-items:center;gap:2px;flex:none}.sktoggle{display:flex;align-items:center;justify-content:center;width:40px;height:30px;margin:-4px -6px -4px 0;padding:0;border:0;border-radius:8px;background:none;color:#111;cursor:pointer;-webkit-tap-highlight-color:transparent}.sktoggle svg{width:22px;height:9px;transition:transform .26s ease}.sktoggle[aria-expanded="true"] svg{transform:rotate(180deg)}.sktoggle:active{background:#f0f0f0}
.fxsubin{margin-top:14px;padding:14px;border:1.5px solid var(--c);border-radius:12px;background:#fafafa}

.ball.nu{background:#fff var(--img-nu) center/cover no-repeat;border-color:#CD2E3A}
.ball.nu .aim i{background:#CD2E3A}
.pname.nu{color:#CD2E3A}
.av.nu{background:#fff var(--img-nu) center/cover no-repeat}
.rb .fill.nu{background:#0047A0}
.rb .fill.jy{background:#f26b35}
.aura{left:0;top:0;width:calc(var(--W)*.22);height:calc(var(--W)*.22);transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(96,102,110,.6);background:radial-gradient(circle,rgba(150,156,166,.06) 52%,rgba(110,116,126,.26) 100%);box-shadow:inset 0 0 10px rgba(90,96,106,.35);animation:aurap 1.6s ease-in-out infinite}
.aura::before{content:'';position:absolute;inset:-7px;border-radius:50%;border:2px dashed transparent}
.aura.full{border-width:3px;border-color:#2d3136;background:radial-gradient(circle,rgba(70,76,86,.10) 45%,rgba(40,44,52,.42) 100%);box-shadow:0 0 14px 3px rgba(60,66,76,.55),inset 0 0 22px rgba(30,34,40,.55);animation:aurap .7s ease-in-out infinite}
.aura.full::before{border-color:rgba(60,66,76,.8);animation:auras 2.2s linear infinite}
@keyframes aurap{0%,100%{opacity:.72}50%{opacity:1}}
@keyframes auras{to{transform:rotate(360deg)}}
.fist{left:0;top:0;font-size:calc(var(--W)*.09);line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.fist.ult{font-size:calc(var(--W)*.13);filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px #2d3136)}
.ultflash{left:0;top:0;width:100%;height:100%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0) 72%)}
.aura{transform:translate(-50%,-50%) scale(1);transition:transform .4s ease-in-out}
.aura.off{transform:translate(-50%,-50%) scale(0);opacity:0;animation:none;transition:transform .4s ease-in-out,opacity .4s ease-in-out}
.rail.cells5 .rb::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--ink),var(--ink)) 20% 0/2px 100% no-repeat,linear-gradient(var(--ink),var(--ink)) 40% 0/2px 100% no-repeat,linear-gradient(var(--ink),var(--ink)) 60% 0/2px 100% no-repeat,linear-gradient(var(--ink),var(--ink)) 80% 0/2px 100% no-repeat}
.aura{border:0;background:none;box-shadow:none}
.aura .tg{position:absolute;inset:0;width:100%;height:100%;opacity:.95}
.aura .tgglow{position:absolute;inset:0;width:100%;height:100%;transform:scale(1.12);filter:blur(calc(var(--W)*.014));opacity:.35;animation:tgglow 1.8s ease-in-out infinite;pointer-events:none}
.aura .wave{position:absolute;inset:0;border-radius:50%;border:3px solid;box-sizing:border-box;opacity:0;pointer-events:none;animation:tgwave 2.4s ease-out infinite}
.aura .wave.r{border-color:rgba(205,46,58,.6)}
.aura .wave.b{border-color:rgba(0,71,160,.6);animation-delay:.6s}
.aura .orbit{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;animation:tgorbit 7s linear infinite;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 2px rgba(255,255,255,.8))}
@keyframes tgglow{0%,100%{opacity:.2}50%{opacity:.45}}
@keyframes tgwave{0%{transform:scale(.4);opacity:0}12%{opacity:.85}100%{transform:scale(1.5);opacity:0}}
@keyframes tgorbit{to{transform:rotate(360deg)}}
.aura.full .tgglow{opacity:.5;animation-duration:.8s}
.aura.full .wave{animation-duration:1.2s}
.aura.full .orbit{animation-duration:2.5s}
.aura .tri{position:absolute;left:-50%;top:-50%;width:200%;height:200%;opacity:0;transition:opacity .35s;animation:tgring 10s linear infinite;pointer-events:none;filter:drop-shadow(0 0 2px #fff)}
.aura.full{border:0;background:none;box-shadow:none}
.aura.full .tg{opacity:1;filter:drop-shadow(0 0 5px rgba(205,46,58,.5)) drop-shadow(0 0 5px rgba(0,71,160,.5));animation:tgbeat .8s ease-in-out infinite}
.aura.full .tri{opacity:1}
.aura.full::before{border-color:rgba(35,35,45,.55)}
@keyframes tgring{to{transform:rotate(360deg)}}
@keyframes tgshimmer{0%,100%{opacity:.2;filter:drop-shadow(0 0 2px rgba(255,255,255,.3))}50%{opacity:.6;filter:drop-shadow(0 0 8px rgba(255,255,255,.8))}}
@keyframes tgbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.aura,.aura.full{animation:none;opacity:.72}
.aura .tgglow,.aura.full .tgglow{animation:none;opacity:.3}
.aura.full .tg{animation:none}
.aura .tri,.aura.full .tri{animation:none}
.aura::before,.aura.full::before{animation:none}
.aura.off,.aura.full.off{transform:translate(-50%,-50%) scale(0);opacity:0;transition:transform .4s ease-in-out,opacity 0s linear .4s}
.flame{width:calc(var(--W)*.05);height:calc(var(--W)*.065);line-height:0;filter:drop-shadow(0 0 3px rgba(255,120,0,.7))}
.flame svg,.tgpart svg,.fxic svg{display:block;width:100%;height:100%}
.flame.ii{width:calc(var(--W)*.066);height:calc(var(--W)*.086);filter:drop-shadow(0 0 5px rgba(255,40,0,.95)) saturate(1.5)}
.tgburst{width:calc(var(--W)*.2);height:calc(var(--W)*.2)}
.burnaura{transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:.6}
.burnaura .fl{position:absolute;border-radius:50%;transform:translate(-50%,-50%);filter:blur(1px);opacity:0;animation:bpart .8s ease-in-out infinite}
.burnaura .fl.g{background:radial-gradient(circle,rgba(105,105,112,.9) 30%,rgba(130,130,138,0) 72%)}
.burnaura .fl.r{background:radial-gradient(circle,rgba(224,36,28,.95) 30%,rgba(224,60,30,0) 72%)}
.burnaura .fl.o{background:radial-gradient(circle,rgba(255,136,24,.95) 30%,rgba(255,150,40,0) 72%)}
.burnaura .fl.y{background:radial-gradient(circle,rgba(255,214,40,.95) 30%,rgba(255,222,70,0) 72%)}
.burnaura.ii .fl.g{background:radial-gradient(circle,rgba(70,70,78,.95) 30%,rgba(100,100,108,0) 72%)}
.burnaura.ii .fl.r{background:radial-gradient(circle,rgba(200,20,20,1) 30%,rgba(224,40,30,0) 72%)}
@keyframes bpart{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.35)}50%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.bflame svg{display:block;width:100%;height:100%}
.tgflag{width:calc(var(--W)*.5);height:calc(var(--W)*.5)}
.tgflag svg{display:block;width:100%;height:100%}
.tgburst svg,.tgtri svg{display:block;width:100%;height:100%}
.tgburst svg{filter:drop-shadow(0 0 8px rgba(255,255,255,.85))}
.tgtri{width:calc(var(--W)*.075);height:calc(var(--W)*.065)}
.tgpart{line-height:1;font-size:calc(var(--W)*.05)}
.fxic svg{width:26px;height:30px}
.bsq{pointer-events:none}

.ball.kk{background:#fff var(--img-kk) center/cover no-repeat;border-color:#7c3aed}
.ball.kk .aim i{background:#7c3aed}
.pname.kk{color:#7c3aed}
.av.kk{background:#fff var(--img-kk) center/cover no-repeat}
.rb .fill.kk{background:#7c3aed}
.ball.bk{background:#fff var(--img-bk) center/cover no-repeat;border-color:#2563eb}
.ball.bk .aim i{background:#2563eb}
.pname.bk{color:#2563eb}
.av.bk{background:#fff var(--img-bk) center/cover no-repeat}
.rb .fill.bk{background:#2563eb}
.ball.st{background:#fff var(--img-st) center/cover no-repeat;border-color:#f28c1a}
.ball.st .aim i{background:#f28c1a}
.pname.st{color:#f28c1a}
.av.st{background:#fff var(--img-st) center/cover no-repeat}
.rb .bkflash{position:absolute;top:-1px;bottom:-1px;z-index:3;pointer-events:none;transform-origin:center}
.nmtxt{display:inline-grid}.nmtxt>span{grid-area:1/1}
.rb .bkdiv{position:absolute;top:0;bottom:0;width:1px;margin-left:-.5px;background:var(--ink);z-index:2;pointer-events:none}
.rb .fill.st{background:#f28c1a}
.kksign{transform:translate(-50%,-100%);display:flex;align-items:flex-end;width:calc(var(--W)*.2);pointer-events:none}
.kksign img{display:block;height:auto;user-select:none;-webkit-user-drag:none}
.mletter{display:flex;align-items:center;transform:translate(-50%,-50%);height:calc(var(--W)*.09);pointer-events:none}
.mletter img{display:block;height:100%;width:auto;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 0 3px rgba(170,120,255,.45));animation:mlf 1.6s ease-in-out infinite alternate}
@keyframes mlf{from{transform:translateY(-2px)}to{transform:translateY(2px)}}
.bhole{transform:translate(-50%,-50%);pointer-events:none;aspect-ratio:1/1;height:auto}
.status.sm{color:#7c3aed;font-weight:500;font-size:calc(var(--W)/2*.054)}
.ball.resist{border-width:2px;box-shadow:inset 0 0 0 2px #3b82f6}   /* 보호 이펙트: 푸른 외곽선 한 줄을 원래 테두리 안쪽에 붙임(전체 굵기 그대로) */
.rb .bb{position:absolute;left:-1px;right:-1px;top:calc(100% + 6px + var(--i,0)*18px);height:14px;border:1px solid var(--ink);box-sizing:border-box;background:var(--rail)}
.rb .bb.bkcells{height:7px}   /* 백기철: 높이만 다른 캐릭터 게이지와 같은 7px, 위 게이지와 간격은 다른 캐릭터의 체력 게이지↔출혈 게이지 간격과 같음 */
.rb .fill.dbf{background:#0ea5e9}
.rb .bb span,.rb .dbtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 9px/1 "IBM Plex Sans KR","Noto Sans KR",sans-serif;color:#fff;-webkit-text-stroke:.5px #000;paint-order:stroke fill;white-space:nowrap;pointer-events:none;z-index:1}
.rb .dbtxt{font-weight:900;font-size:7px;-webkit-text-stroke:.4px #000;z-index:3}
.rb .bb i{position:absolute;inset:0;background:#b3001b;transform-origin:left center;transform:scaleX(0)}
.hud>div.bleeding .status{margin-top:calc(10px + var(--nb,1)*18px + var(--tall,0px))}
.auralayer{position:absolute;inset:0;pointer-events:none;z-index:1}
.auralayer>*{position:absolute}
.ball{z-index:2}

/* 녹화 금지 안내 (로비·게임 중 항상 표시) */
.recwarn{position:absolute;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);text-align:center;font:500 11px/1.35 "IBM Plex Sans KR","Noto Sans KR",sans-serif;color:#8d9193;text-wrap:balance;word-break:keep-all;pointer-events:none;user-select:none}
/* 버전 표시 + 패치노트 (로비 구석) */
.credit{position:absolute;left:0;right:0;top:14px;text-align:center;font:800 14px/1 "IBM Plex Sans KR","Noto Sans KR",sans-serif;color:#6f7477;letter-spacing:.2px;pointer-events:none;user-select:none}
.vtag{position:absolute;right:14px;bottom:12px;font:400 11px/1 "IBM Plex Sans KR","Noto Sans KR",sans-serif;color:#aaa;pointer-events:none;user-select:none}
.pnbtn{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top,0px));width:38px;height:38px;padding:5px;background:none;border:0;color:#8a8f92;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pnbtn svg{display:block;width:100%;height:100%}
.pnbtn:active{color:#444}
.stage:has(.end:not([hidden])) .vtag,.stage:has(.end:not([hidden])) .pnbtn{display:none}
.pnmodal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:12}
.pnmodal[hidden]{display:none}
.pnpanel{position:relative;width:100%;max-width:560px;max-height:min(86vh,720px);overflow:auto;background:var(--bg);border:3px solid var(--ink);padding:52px 20px 24px;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#111;-webkit-font-smoothing:antialiased}
.pnclose{position:absolute;top:8px;right:8px;width:36px;height:36px;font-size:20px;line-height:1;color:var(--ink);background:transparent;border:2px solid var(--ink);cursor:pointer}
.pntitle{position:absolute;left:20px;top:14px;font-size:20px;font-weight:700}
.pnver{margin:0 0 22px}
.pnver:last-child{margin-bottom:0}
.pnvh{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
.pnvh b{font-size:19px}.pnvh span{font-size:12px;color:#999}.pnvh i{font-style:normal;font-size:11px;font-weight:700;color:#fff;background:#e02424;padding:2px 7px;border-radius:3px;line-height:1.35;align-self:center}

<script>
function lockToast(){                 // 점검 중인 캐릭터를 누르면 안내 문구
  const pn=document.querySelector('.modal .panel');if(!pn)return;
  pn.querySelectorAll('.mtoast').forEach(x=>x.remove());
  const t=document.createElement('div');t.className='mtoast';t.textContent='점검 중인 캐릭터입니다.';pn.appendChild(t);
  try{t.animate([{opacity:0},{opacity:1,offset:.12},{opacity:1,offset:.8},{opacity:0}],{duration:1800,fill:'forwards'}).onfinish=()=>t.remove()}catch(e){setTimeout(()=>t.remove(),1800)}
}
let stOpen=false;                       // 점검 중인 캐릭터는 코드를 맞게 입력하면 이 페이지를 닫을 때까지 쓸 수 있음
const codeOk=v=>{let h=0x811c9dc5;for(const b of new TextEncoder().encode('st-lock:'+v)){h^=b;h=Math.imul(h,0x01000193)>>>0}return h===1586651393};
function askCode(done){
  const box=document.createElement('div');box.className='codebox';
  box.innerHTML='<div class="codecard"><p class="codemsg">점검 중인 캐릭터입니다.<br>플레이하려면 코드를 입력해야 합니다.</p><input class="codein" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="코드"><p class="codeerr" aria-live="polite"></p><div class="coderow"><button type="button" class="codeno">취소</button><button type="button" class="codeyes">확인</button></div></div>';
  document.body.appendChild(box);
  const inp=box.querySelector('.codein'),err=box.querySelector('.codeerr'),close=()=>box.remove();
  const go=()=>{if(codeOk(inp.value.trim())){stOpen=true;close();done()}else{err.textContent='코드가 틀렸습니다.';inp.value='';inp.focus()}};
  box.querySelector('.codeyes').addEventListener('click',go);
  box.querySelector('.codeno').addEventListener('click',close);
  box.addEventListener('click',e=>{if(e.target===box)close()});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();else if(e.key==='Escape')close()});
  setTimeout(()=>inp.focus(),30);
}
function calcShift(){
  try{
    const c=document.createElement('canvas').getContext('2d');
    c.font='100px "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    const m=c.measureText('가나다상환');
    const A=m.fontBoundingBoxAscent/100,D=m.fontBoundingBoxDescent/100,a=m.actualBoundingBoxAscent/100,d=m.actualBoundingBoxDescent/100;
    const sh=((A-D)-(a-d))/2;
    if(isFinite(sh))document.documentElement.style.setProperty('--shift',sh.toFixed(3));
  }catch(e){}
}
calcShift();
if(document.fonts){document.fonts.load('400 20px "Noto Sans KR"').then(calcShift).catch(()=>{});document.fonts.ready.then(calcShift)}

/* ---------- hit sound (Web Audio, no files) ---------- */
let actx=null,master=null,reverb=null,lastHit=0;
function resumeAudio(){             // 'suspended'뿐 아니라 'interrupted'(iOS 화면 녹화 시작 등)에서도 다시 켬
  try{if(actx&&actx.state!=='running'){const p=actx.resume();if(p&&p.catch)p.catch(()=>{})}}catch(e){}
}
function audioHint(){                // 소리가 멈춘 채로 게임 중일 때만 작게 안내
  const el=document.getElementById('audiohint');if(!el)return;
  el.hidden=!(actx&&actx.state!=='running'&&phase!=='idle');
}
function initAudio(){
  try{
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}   // iOS: 무음 스위치/녹화와 상관없이 '재생'으로 취급
    if(!actx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){
        actx=new AC();
        master=actx.createGain();master.gain.value=1.15;
        const comp=actx.createDynamicsCompressor();
        comp.threshold.value=-14;comp.knee.value=12;comp.ratio.value=6;comp.attack.value=.002;comp.release.value=.2;
        master.connect(comp);comp.connect(actx.destination);
        if(actx.addEventListener)actx.addEventListener('statechange',()=>{if(actx.state!=='running')resumeAudio();audioHint()});
      }
    }
    resumeAudio();audioHint();
  }catch(e){}
}
let hitBus=null;
function playHit(){                 // 벽·공끼리 부딪히는 소리 (아주 크게)
  if(!actx||actx.state!=='running')return;
  try{
  const t=actx.currentTime;if(t-lastHit<.04)return;lastHit=t;
  if(!hitBus){hitBus=actx.createGain();hitBus.gain.value=3.2;hitBus.connect(master)}
  const o=actx.createOscillator(),g=actx.createGain();
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;
  o.type='sine';
  o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(70,t+.1);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(1.3,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.2);
  o.connect(lp);lp.connect(g);g.connect(hitBus);o.start(t);o.stop(t+.21);
  const o2=actx.createOscillator(),g2=actx.createGain();                         // 폰 스피커에서도 들리는 짧은 '툭'
  o2.type='triangle';o2.frequency.setValueAtTime(360,t);o2.frequency.exponentialRampToValueAtTime(140,t+.06);
  g2.gain.setValueAtTime(.0001,t);g2.gain.exponentialRampToValueAtTime(.8,t+.004);g2.gain.exponentialRampToValueAtTime(.0001,t+.1);
  o2.connect(g2);g2.connect(hitBus);o2.start(t);o2.stop(t+.11);
  const sr=actx.sampleRate,n=Math.floor(sr*.03),nb=actx.createBuffer(1,n,sr),d=nb.getChannelData(0);   // 타격 순간의 짧은 '탁'
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const ns=actx.createBufferSource(),ng=actx.createGain(),nf=actx.createBiquadFilter();nf.type='bandpass';nf.frequency.value=1800;nf.Q.value=.8;ng.gain.value=.7;
  ns.buffer=nb;ns.connect(nf);nf.connect(ng);ng.connect(hitBus);ns.start(t);
  }catch(e){}
}

function ensureReverb(){            // 멀리 울려 퍼지는 메아리 (생성한 임펄스)
  if(reverb)return reverb;
  const sr=actx.sampleRate,len=Math.floor(sr*.55),buf=actx.createBuffer(1,len,sr),d=buf.getChannelData(0);
  let prev=0;for(let i=0;i<len;i++){prev=prev*.62+(Math.random()*2-1)*.38;d[i]=prev*Math.pow(1-i/len,3)}
  reverb=actx.createConvolver();reverb.buffer=buf;reverb.connect(master);return reverb;
}
function playGun(){                 // 저격총: 날카로운 '팡' + 묵직한 울림 + 길게 퍼지는 메아리
  if(!actx||actx.state!=='running')return;
  try{
    const t=actx.currentTime,sr=actx.sampleRate;
    const bus=actx.createGain();bus.gain.value=1;
    const dry=actx.createGain();dry.gain.value=1;bus.connect(dry);dry.connect(master);
    const wet=actx.createGain();wet.gain.value=.5;bus.connect(wet);wet.connect(ensureReverb());
    const noise=(sec,pw)=>{const n=Math.floor(sr*sec),b=actx.createBuffer(1,n,sr),d=b.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,pw);return b};
    const crack=actx.createBufferSource(),chp=actx.createBiquadFilter(),cg=actx.createGain();     // 1) 총알 터지는 '딱' (초음속 크랙)
    crack.buffer=noise(.045,2);chp.type='highpass';chp.frequency.value=2200;cg.gain.value=1.1;
    crack.connect(chp);chp.connect(cg);cg.connect(bus);crack.start(t);
    const punch=actx.createBufferSource(),pbp=actx.createBiquadFilter(),pg=actx.createGain();     // 2) '빵' 하는 중음 펀치
    punch.buffer=noise(.14,2.2);pbp.type='bandpass';pbp.frequency.value=1100;pbp.Q.value=.7;pg.gain.value=1;
    punch.connect(pbp);pbp.connect(pg);pg.connect(bus);punch.start(t);
    const boom=actx.createBufferSource(),blp=actx.createBiquadFilter(),bg=actx.createGain();      // 3) 총구에서 퍼지는 폭발음 (주파수가 내려감)
    boom.buffer=noise(.5,2);blp.type='lowpass';
    blp.frequency.setValueAtTime(3200,t);blp.frequency.exponentialRampToValueAtTime(260,t+.45);
    bg.gain.value=.9;boom.connect(blp);blp.connect(bg);bg.connect(bus);boom.start(t);
    const o=actx.createOscillator(),og=actx.createGain();                                           // 4) 가슴을 치는 저음
    o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(34,t+.3);
    og.gain.setValueAtTime(.0001,t);og.gain.exponentialRampToValueAtTime(1,t+.004);og.gain.exponentialRampToValueAtTime(.0001,t+.34);
    o.connect(og);og.connect(bus);o.start(t);o.stop(t+.36);
  }catch(e){}
}

function playBurn(lvl){             // 연소: 치익— 불이 붙는 소리 + 타닥 (연소II는 더 깊고 크게)
  if(!actx||actx.state!=='running')return;
  try{
    const t=actx.currentTime,sr=actx.sampleRate,big=lvl>=2,dur=big?.36:.26;
    const n=Math.floor(sr*dur),b=actx.createBuffer(1,n,sr),d=b.getChannelData(0);
    for(let i=0;i<n;i++){const e=Math.sin(Math.PI*i/n);d[i]=(Math.random()*2-1)*e*e}
    const s1=actx.createBufferSource(),bp=actx.createBiquadFilter(),g=actx.createGain();
    s1.buffer=b;bp.type='bandpass';bp.Q.value=big?.7:1.1;bp.frequency.setValueAtTime(big?1500:2400,t);bp.frequency.exponentialRampToValueAtTime(big?420:800,t+dur);
    g.gain.value=big?.6:.4;s1.connect(bp);bp.connect(g);g.connect(master);s1.start(t);
    for(let k=0;k<(big?4:2);k++){                                   // 타닥타닥
      const at=t+.03+Math.random()*(dur-.06),m=Math.floor(sr*.012),pb=actx.createBuffer(1,m,sr),pd=pb.getChannelData(0);
      for(let i=0;i<m;i++)pd[i]=(Math.random()*2-1)*Math.pow(1-i/m,2);
      const ps=actx.createBufferSource(),hp=actx.createBiquadFilter(),pg=actx.createGain();
      ps.buffer=pb;hp.type='highpass';hp.frequency.value=big?1800:2600;pg.gain.value=big?.55:.38;
      ps.connect(hp);hp.connect(pg);pg.connect(master);ps.start(at);
    }
    if(big){const o=actx.createOscillator(),og=actx.createGain();o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(55,t+.3);og.gain.setValueAtTime(.0001,t);og.gain.exponentialRampToValueAtTime(.45,t+.02);og.gain.exponentialRampToValueAtTime(.0001,t+.32);o.connect(og);og.connect(master);o.start(t);o.stop(t+.34)}   // 깊은 불길 울림
  }catch(e){}
}

/* ---------- aiming line (before start) ---------- */
function spin(ball){
  const aim=ball.querySelector('.aim');
  let phaseDeg,tries=0;
  do{phaseDeg=Math.random()*360;tries++}while(tries<50&&used.some(u=>{const d=Math.abs(u-phaseDeg)%360;return Math.min(d,360-d)<40}));
  used.push(phaseDeg);
  aim.style.opacity=1;
  ball._dur=800/(1+Math.random()*0.1);
  ball._phase=phaseDeg;
  ball._anim=aim.animate([{transform:'rotate('+phaseDeg+'deg)'},{transform:'rotate('+(phaseDeg+360)+'deg)'}],
    {duration:ball._dur,iterations:Infinity,easing:'linear'});
}
function angleOf(ball){return (ball._phase+(ball._anim.currentTime%ball._dur)/ball._dur*360)%360}
function freezeAim(ball){if(ball._anim){ball._deg=angleOf(ball);ball._anim.pause()}}
function release(ball){
  let deg=ball._deg;
  if(deg===undefined)deg=ball._anim?angleOf(ball):Math.random()*360;
  if(ball._anim){ball._anim.cancel();ball._anim=null}
  ball.querySelector('.aim').style.opacity=0;
  launch(ball,deg);
}
function launch(ball,deg){
  const c=ball._c,a=deg*Math.PI/180;
  if(!c||movers.includes(c))return;
  c.vx=Math.cos(a);c.vy=Math.sin(a);c.started=true;movers.push(c);
  if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}
}

function renderHp(c){c.hpEl.textContent=Math.ceil(c.hp-1e-9)+' / '+c.max}   // 소수점 체력은 데이터에만 남기고 표시는 정수로
/* 체력바: 초록은 줄어들고(빠르다가 끝에 느리게), 깎인 만큼 빨강이 남았다가 0.2초 뒤 더 빠르게 따라 줄어듦 */
let barRaf=0;
const easeOut=x=>1-Math.pow(1-x,3);
function initBar(c){c.rQ=[];c.hg=100;c.hl=100;c.hr=100;c.gAnim=null;c.lAnim=null;c.rAnim=null;paintBar(c)}
function paintBar(c){
  c.hpEl.style.setProperty('--g',c.hg+'%');
  c.hpEl.style.setProperty('--l',Math.max(c.hl,c.hg)+'%');
  c.hpEl.style.setProperty('--r',Math.max(c.hr,c.hg)+'%');
}
/* 체력 데이터(c.hp)는 즉시 바뀌고, 막대만 모션으로 따라감
   회복: 밝은 초록(회복되는 부분만) 0.15초 → 기존 초록이 0.1초 만에 따라 참
   피해: 초록 0.2초(빠르다 느리게) → 빨강 0.2초 뒤 0.15초 / 회복 모션 중 피해를 입으면 밝은 초록도 같이 줄어듦 */
function hpChange(c,oldHp){
  const t0=performance.now(),tp=c.hp/c.max*100;
  if(c.hp>oldHp){
    c.rQ=[];c.rAnim=null;
    c.lAnim={from:Math.max(c.hg,c.hl),to:tp,t0,dur:150};
    c.gAnim={from:c.hg,to:tp,t0:t0+150,dur:100};
  }else if(c.hp<oldHp){
    const top=Math.max(c.hg,c.hl);
    if(c.hg>tp)c.gAnim={from:c.hg,to:tp,t0,dur:200};
    else if(c.gAnim&&c.gAnim.to>tp)c.gAnim={from:c.hg,to:tp,t0:Math.max(t0,c.gAnim.t0),dur:100};
    if(c.hl>tp)c.lAnim={from:c.hl,to:tp,t0,dur:200};
    else if(c.lAnim&&c.lAnim.to>tp)c.lAnim={from:c.hl,to:tp,t0,dur:100};
    if(top>tp){                                                  // 맞을 때마다 0.2초 뒤에 빨강이 그만큼 따라 줄어듦 (연달아 맞아도 각각 따로 0.2초 뒤에 들어옴)
      c.hr=Math.max(c.hr,top);
      (c.rQ=c.rQ||[]).push({t:t0+200,to:tp});
    }  }
  if(!barRaf)barRaf=requestAnimationFrame(barFrame);
}
function barFrame(){
  const t=performance.now();let busy=false;
  for(const c of chars){
    if(c.rQ&&c.rQ.length){
      let due=null;while(c.rQ.length&&c.rQ[0].t<=t)due=c.rQ.shift();
      if(due)c.rAnim={from:c.hr,to:due.to,t0:t,dur:150};
      if(c.rQ.length)busy=true;
    }
    for(const [k,key] of [['gAnim','hg'],['lAnim','hl'],['rAnim','hr']]){
      const a=c[k];if(!a)continue;
      const x=Math.min(1,Math.max(0,(t-a.t0)/a.dur));
      c[key]=a.from+(a.to-a.from)*easeOut(x);
      if(x>=1){c[key]=a.to;c[k]=null}else busy=true;
    }
    paintBar(c);
  }
  barRaf=busy?requestAnimationFrame(barFrame):0;
}

const BLEED={revHp:100,gap:10,cdAdd:2,dmg:5,seq1:1.2,seq2:1.4};   // 출혈: 10초마다 5

function playBleed(big){            // 약간 삭은 느낌: 파—샤삭 (마른 것이 으스러지는 소리)
  if(!actx||actx.state!=='running')return;
  try{
    const t=actx.currentTime,sr=actx.sampleRate,n=big?5:3;
    for(let k=0;k<n;k++){
      const at=t+k*(.045+Math.random()*.03),len=Math.floor(sr*(k===0?.09:.05)),b=actx.createBuffer(1,len,sr),d=b.getChannelData(0);
      for(let i=0;i<len;i++){const e=Math.pow(1-i/len,k===0?1.4:2.4);d[i]=(Math.random()*2-1)*e*(Math.random()<.35?1:.45)}
      const s1=actx.createBufferSource(),bp=actx.createBiquadFilter(),g=actx.createGain();
      s1.buffer=b;bp.type='bandpass';bp.Q.value=.8;bp.frequency.value=k===0?1300:2600+Math.random()*1800;
      g.gain.value=(k===0?.55:.38)*(big?1.2:1);s1.connect(bp);bp.connect(g);g.connect(master);s1.start(at);
    }
    const o=actx.createOscillator(),og=actx.createGain();o.type='triangle';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(70,t+.22);
    og.gain.setValueAtTime(.0001,t);og.gain.exponentialRampToValueAtTime(big?.3:.18,t+.015);og.gain.exponentialRampToValueAtTime(.0001,t+.24);o.connect(og);og.connect(master);o.start(t);o.stop(t+.26);
  }catch(e){}
}

function addBar(c,cls,html){          // 체력바 밑에 게이지 바를 한 줄 더 붙임 (먼저 만든 것이 위, 나중에 만든 것이 아래 → 출혈바는 늘 맨 아래)

function startRevive(c){            // 체력이 0이 되면 바로 터지지 않고, 잠깐 멈춘 채로 '심장을 열고..' 연출 뒤 체력 가득 부활 (1번만)
  c.revived=true;c.reviving=true;revPause++;objStop++;
  chars.forEach(o=>o.frozen++);
  addTag(c,'심장을 열고..','organ1');c.tags[c.tags.length-1].kind='organ1';
  bloodFx(c,10,false);playBleed(false);
  try{c.ball.animate([{filter:'brightness(1)'},{filter:'brightness(.45) sepia(1) saturate(5) hue-rotate(-35deg)'},{filter:'brightness(1)'}],{duration:500,iterations:3})}catch(e){}
  sched(BLEED.seq1,()=>{
    dropTag(c,'organ1');addTag(c,'장기를 꺼내어...','organ2');c.tags[c.tags.length-1].kind='organ2';
    bloodFx(c,26,true);playBleed(true);
  },false,true);
  sched(BLEED.seq1+BLEED.seq2,()=>{

    revPause=Math.max(0,revPause-1);objStop=Math.max(0,objStop-1);
    chars.forEach(o=>o.frozen=Math.max(0,o.frozen-1));

    const old=c.hp;c.max=BLEED.revHp;c.hp=c.max;renderHp(c);hpChange(c,old);playHeal();bloodFx(c,14,true);
    c.mode='fill';c.gauge=0;c.btime=0;c.left=0;endBoostUI(c);c.cd+=BLEED.cdAdd;        // 부활하면 스킬 게이지 초기화(1년후 등도 취소) + 스킬 쿨타임 +2초
    if(c.fill)c.fill.style.transform='scaleX(0)';

  },false,true);

function applyTempBleed(t,lvl,sec){   // 백기철 판타지의 디버프로 걸리는 잠깐짜리 출혈(II): 걸린 순간부터 간격마다 피해
  if(t.tbUntil>now){t.tbLvl=Math.max(t.tbLvl||1,lvl);t.tbUntil=Math.max(t.tbUntil,now+sec)}
  else{t.tbLvl=lvl;t.tbUntil=now+sec;t.tbNext=now}
}
function bleedTick(dt){             // 출혈: 10초에 한 번 체력 5 (정지 중에는 시간도 같이 정지)
  for(const c of chars){
    if(!c.tbUntil||!c.alive||over)continue;
    if(c.frozen>0){c.tbNext+=dt;c.tbUntil+=dt;continue}
    while(c.alive&&!over&&c.tbNext<=now&&c.tbNext<=c.tbUntil+1e-9){
      const L=c.tbLvl===2?BLEED2:BLEED;c.tbNext+=L.gap;
      bloodFx(c,22,false);playBleed(false);hurt(c,L.dmg);
    }
    if(now>=c.tbUntil)c.tbUntil=0;
  }
  for(const c of chars){
    if(!c.alive||over||!c.bleed)continue;
    if(c.frozen>0)c.bleedNext+=dt;
    if(c.bbFill)c.bbFill.style.transform='scaleX('+Math.min(1,Math.max(0,1-(c.bleedNext-now)/BLEED.gap))+')';
    if(c.frozen>0)continue;
    while(c.alive&&!over&&c.bleedNext<=now){
      c.bleedNext+=BLEED.gap;
      bloodFx(c,22,false);playBleed(false);
      hurt(c,BLEED.dmg);
    }
  }
}

const SLOW={sec:1.75,mul:.5,mul2:.25};          // 꼼짝마를 맞으면 걸리는 슬로우: 이동속도 절반, 1.75초 (겹치지 않고 시간만 갱신)

function sFreeze(c,done){            // 꼼짝마!
  {const d0=done;done=()=>{try{d0()}finally{skillEnded(c,'freeze')}}}
  const t=foe(c);addTag(c,'꼼짝마!','freeze');
  if(!t){sched(FREEZE_SHOT,done);return}
  t.frozen++;c.frozen++;objStop++;
  const bang=follow(mk('bang','!'),t),ring=follow(mk('ringw','<div class="ring"></div>'),t);
  let lab=null,lab2=null,m=0;

    m=dist(c,t);
    lab=follow(mk('dist',m+'m'),t,-(R+.015),false);
    lab2=follow(mk('dmg',freezeLabel(m)),t,-(R+.055),false);
  });
  sched(FREEZE_SHOT,()=>{                                           // 발사
    objStop=Math.max(0,objStop-1);
    t.frozen=Math.max(0,t.frozen-1);c.frozen=Math.max(0,c.frozen-1);
    try{
      unfollow(bang);unfollow(ring);
      if(lab){const l=lab,l2=lab2;sched(.2,()=>{unfollow(l);unfollow(l2)})}
      if(c.alive&&t.alive){playGun();shotFx(c,t);hurt(t,(freezeDmg(m)+atk(c))*frail(c));if(t.alive)applySlow(t,1,SLOW.sec)}
    }finally{done()}
  });
}

  {const d0=done;done=()=>{try{d0()}finally{skillEnded(c,'pct')}}}

  sched(1.3,()=>{try{if(c.alive&&t&&t.alive){const dmg=Math.round(t.hp*.4);percentFx(t,dmg);hurt(t,(dmg+atk(c))*frail(c))}}finally{done()}});
}
function sHeal(c,done){              // 체력별로 회복해 드립니다: 내 현재 체력의 40% 회복 (소수 반올림, 최대 체력까지)
  {const d0=done;done=()=>{try{d0()}finally{skillEnded(c,'heal')}}}
  addTag(c,'체력별로 회복해 드립니다','heal');
  sched(1.3,()=>{try{if(c.alive){const amt=Math.min(c.max-c.hp,Math.round(c.hp*.4));healFx(c,amt);heal(c,amt)}}finally{done()}});
}
function sYear(c){                   // 1년후
  addTag(c,'1년후','year');
  c.mode='boost';c.btime=0;c.left=5;
  c.rail.classList.add('boost');
  c.status.textContent='1년치 게이지 다 채우는 중';
  c.num.textContent='0';c._n=0;
}
function runChain(c){
  if(!c.alive||c.mode!=='chain')return;
  if(revPause>0){sched(.1,()=>runChain(c));return}
  if(c.left<=0||!foe(c)){endBoostUI(c);c.gauge=0;c.mode='fill';return}
  c.left--;c.num.textContent=c.left;
  if(c.left===0){endBoostUI(c);c.gauge=0;c.mode='fill'}      // 0이 되는 즉시 원래 게이지로 복귀해서 다시 충전
  const q=Math.random(),k=q<.4?sFreeze:(q<.7?sPercent:sHeal);     // 연속 스킬은 1년후를 뺀 나머지 중에서 (같은 비율)
  const next=()=>sched(2,()=>runChain(c));
  if(c.silenceUntil>now){next();return}                           // 스킬 실패 중이면 연달아 쓰는 스킬도 써지지 않음
  try{k(c,next)}catch(e){console.error(e);next()}
}
function startCast(c){
  if(revPause>0)return;                           // 부활 연출 중에는 스킬이 써지지 않음
  if(!foe(c)){c.gauge=0;return}
  if(c.silenceUntil>now){c.gauge=0;burstAt(c.x*arenaEl.clientWidth,c.y*arenaEl.clientHeight,'#9aa0a6',.5,4);return}   // 스킬 실패: 써지지 않고 게이지만 비워짐
  if(c.kind==='kk'){castKK(c);return}
  if(c.kind==='jy'){castJy(c);return}
  const r=Math.random();                          // 꼼짝마 30% / 체력별 데미지 25% / 체력별 회복 25% / 1년후 20%
  if(r>=.8){sYear(c);return}
  c.mode='cast';
  c.skillT=now;
  const end=()=>{if(c.alive&&c.mode==='cast'){c.gauge=0;c.mode='fill'}};
  try{(r<.3?sFreeze:(r<.55?sPercent:sHeal))(c,end)}catch(e){console.error(e);end()}
}

/* ---------- 제리얌: 음식 소환 / 밥상 던지기 / 포크 ---------- */
const HIT_GUARD=.05;                  // 부딪힘 계열 타격: 같은 충돌이 한 번에 여러 번 세어지지 않게 하는 아주 짧은 간격(초)
const JY={burgerHeal:30,buffMul:2,buffSec:5,strAtk:10,strSec:10,wallDmg2:8,maxFood:150,

let shakeAnim=null;
function shake(amp,ms){             // 화면이 흔들리는 느낌 (폰 진동 아님)
  try{
    const el=document.querySelector('.stage');if(!el)return;
    if(shakeAnim)shakeAnim.cancel();
    const kf=[],n=9;
    for(let i=0;i<n;i++){const k=1-i/n;kf.push({transform:'translate('+((Math.random()*2-1)*amp*k)+'px,'+((Math.random()*2-1)*amp*k)+'px)'})}
    kf.push({transform:'translate(0,0)'});
    shakeAnim=el.animate(kf,{duration:ms,easing:'linear'});
  }catch(e){}
}
function burstAt(cx,cy,col,sc,n){   // 임팩트: 링 + 번쩍 + 불꽃 (px 좌표)
  try{
    const W=arenaEl.clientWidth,base=W*.1*sc;
    const ring=mk('pring','');ring.style.left=cx+'px';ring.style.top=cy+'px';ring.style.borderColor=col;
    ring.animate([{width:base*.4+'px',height:base*.4+'px',borderWidth:'5px',opacity:1},{width:base*2+'px',height:base*2+'px',borderWidth:'1px',opacity:0}],
      {duration:380,easing:'cubic-bezier(.15,.7,.3,1)',fill:'forwards'}).onfinish=()=>ring.remove();
    const fl=mk('impact','');fl.style.left=cx+'px';fl.style.top=cy+'px';
    fl.animate([{opacity:1,transform:'scale(.5)'},{opacity:0,transform:'scale('+(1.4+sc*.5)+')'}],{duration:170,easing:'ease-out',fill:'forwards'}).onfinish=()=>fl.remove();
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,len=W*(.05+Math.random()*.1)*sc,rot=a*180/Math.PI+90;
      const sp=mk('spark','');sp.style.left=cx+'px';sp.style.top=cy+'px';sp.style.background=col;
      sp.animate([{opacity:1,transform:'translate(-50%,-50%) rotate('+rot+'deg)'},
        {opacity:0,transform:'translate(calc(-50% + '+Math.cos(a)*len+'px),calc(-50% + '+Math.sin(a)*len+'px)) rotate('+rot+'deg)'}],
        {duration:240+Math.random()*160,easing:'ease-out',fill:'forwards'}).onfinish=()=>sp.remove();
    }
  }catch(e){}
}
function dmgPop(t,txt,col,below){   // (지금은 쓰지 않음) 머리 위/아래에 떠오르는 짧은 글자 — 요청하신 표시만 남기려고 호출을 모두 뺐어요
  try{
    const el=mk('dpop','<b>'+txt+'</b>');el.style.color=col;
    const f=follow(el,t,below?(R+.01):-(R+.02));f.keep=true;
    const base=below?'translate(-50%,0)':'translate(-50%,-100%)',d=below?1:-1;
    el.animate([{opacity:0,transform:base+' translateY('+(-d*6)+'px) scale(.6)'},
      {opacity:1,transform:base+' translateY('+(d*2)+'px) scale(1.15)',offset:.18},
      {opacity:1,transform:base+' translateY('+(d*10)+'px) scale(1)',offset:.7},
      {opacity:0,transform:base+' translateY('+(d*22)+'px) scale(1)'}],{duration:1100,fill:'forwards'});
    later(()=>unfollow(f),1110);
  }catch(e){}
}

/* 음식: 제리얌만 먹을 수 있고, 상대가 닿아도 아무 영향 없이 통과 */
function removeFood(f){f.el.remove();foods=foods.filter(x=>x!==f)}
function spawnFood(c,kind){
  let x=.5,y=.5;
  for(let i=0;i<20;i++){x=.1+Math.random()*.8;y=.1+Math.random()*.8;if(Math.hypot(x-c.x,y-c.y)>.2)break}
  const el=mk('food',FOOD[kind]);el.style.left=x*100+'%';el.style.top=y*100+'%';
  el.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:0},{transform:'translate(-50%,-50%) scale(1.25)',opacity:1,offset:.6},
    {transform:'translate(-50%,-50%) scale(1)',opacity:1}],{duration:320,easing:'ease-out',fill:'forwards'});
  foods.push({kind,owner:c,x,y,el,born:now});
  const mine=foods.filter(o=>o.owner===c);
  if(mine.length>JY.maxFood)removeFood(mine[0]);
  burstAt(x*arenaEl.clientWidth,y*arenaEl.clientHeight,'#ffffff',.6,5);
}
function eatFood(f){
  const o=f.owner;removeFood(f);playEat();
  burstAt(f.x*arenaEl.clientWidth,f.y*arenaEl.clientHeight,'#ffd24a',.7,6);
  if(f.kind==='burger'){const amt=Math.min(o.max-o.hp,JY.burgerHeal);healFx(o,amt);heal(o,amt);addStrength(o)}   // 회복 이펙트 + 체력바 모션 그대로, 그리고 힘 효과
  else if(f.kind==='chicken')addSpeedBuff(o,JY.buffMul,JY.buffSec);
  else vegSkill(o);
}
function tickFoods(){
  for(const f of foods.slice()){
    const o=f.owner;
    if(!o.alive){removeFood(f);continue}
    if(o.started&&Math.hypot(o.x-f.x,o.y-f.y)<R+.045)eatFood(f);
  }
}

/* 이동속도 버프 (모든 이속 버프가 이 이펙트를 같이 씀) */
function addSpeedBuff(c,mul,sec){
  const fresh=!(c.buffUntil>now);
  c.buffMul=fresh?mul:Math.max(c.buffMul||1,mul);        // 겹쳐서 곱해지지 않고 가장 큰 값 하나만 적용
  c.buffUntil=now+sec;                                    // 다시 얻으면 시간만 처음부터 다시
  if(!fresh)return;                                       // 이미 걸려 있으면 이펙트도 겹쳐서 또 만들지 않음
  c.ball.classList.add('fast');
  playBuff();burstAt(c.x*arenaEl.clientWidth,c.y*arenaEl.clientHeight,'#ffb02e',1.1,10);
}
/* 힘: 내가 입히는 직접 공격·스킬 데미지 +10 (10초). 겹치지 않고 다시 얻으면 시간만 갱신.
   부딪힘 같은 디버프 상태효과가 주는 데미지(벽 충돌)는 힘으로 늘어나지 않음 */
const atk=c=>(c&&c.strUntil>now)?JY.strAtk:0;
const FRAIL={cut:.2};                 // 빈약함: 자신이 주는 데미지 20% 감소
const frail=c=>(c&&((c.frailPerm&&!lostPas(c))||c.frailUntil>now))?1-FRAIL.cut:1;
function addStrength(c){
  const fresh=!(c.strUntil>now);
  c.strUntil=now+JY.strSec;
  if(fresh)c.ball.classList.add('strong');
}
function buffTick(){                  // 버프가 끝나면 원래대로
  for(const c of chars){
    if(!c.alive)continue;
    if(!(c.buffUntil>now)&&c.buffUntil){c.buffUntil=0;c.buffMul=1;c.ball.classList.remove('fast')}
    if(!(c.strUntil>now)&&c.strUntil){c.strUntil=0;c.ball.classList.remove('strong')}
  }
}

/* 야채: 닿으면 멈춰서 '이런 반찬 안 먹찬' → 밥상을 던짐 */
function vegSkill(o){
  o.frozen++;addTag(o,'이런 반찬 안 먹찬','veg');
  sched(1.0,()=>{try{const t=foe(o);if(o.alive&&t)throwTable(o,t)}catch(e){console.error(e)}});
  sched(1.3,()=>{o.frozen=Math.max(0,o.frozen-1)});
}
function throwTable(o,t){
  let dx=t.x-o.x,dy=t.y-o.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
  const el=mk('table',TABLE_SVG);
  projs.push({owner:o,x:o.x+dx*(R+.03),y:o.y+dy*(R+.03),vx:dx,vy:dy,sp:JY.tableSpeed,r:.05,el,born:now,spin:0});
  playThrow();
}
function removeProj(p){p.el.remove();projs=projs.filter(x=>x!==p);skillEnded(p.owner,'veg')}
function stepProjs(h){              // 밥상: 벽에서 계속 튕기고, 던진 제리얌은 그냥 통과, 상대에게만 맞음
  for(const p of projs.slice()){
    p.x+=p.vx*p.sp*h;p.y+=p.vy*p.sp*h;
    let b=false;
    if(p.x<p.r){p.x=p.r;p.vx=Math.abs(p.vx);b=true}else if(p.x>1-p.r){p.x=1-p.r;p.vx=-Math.abs(p.vx);b=true}
    if(p.y<p.r){p.y=p.r;p.vy=Math.abs(p.vy);b=true}else if(p.y>1-p.r){p.y=1-p.r;p.vy=-Math.abs(p.vy);b=true}
    if(b){playHit();p.bn=(p.bn||0)+1;if(p.bn>=5){removeProj(p);continue}}     // 벽에 5번 튕기면 사라짐
    const t=foe(p.owner);
    if(t&&t.alive&&Math.hypot(t.x-p.x,t.y-p.y)<R+p.r*.8){tableHit(p,t);continue}
    if(now-p.born>JY.tableLife)removeProj(p);
  }
}
function renderProjs(dt,W,H){
  for(const p of projs){if(!objStop)p.spin+=720*dt;p.el.style.left=p.x*W+'px';p.el.style.top=p.y*H+'px';p.el.style.transform='translate(-50%,-50%) rotate('+p.spin+'deg)'}
}
function tableHit(p,t){
  removeProj(p);
  const W=arenaEl.clientWidth,H=arenaEl.clientHeight;
  playPunch(1);burstAt(t.x*W,t.y*H,'#ffd24a',1.3,12);shake(10,360);
  hurt(t,(JY.tableDmg+atk(p.owner))*frail(p.owner));
  if(t.alive)applyKnock(t,p.vx,p.vy,JY.knockSec,2);                      // 이런 반찬 안 먹찬의 밥상 = 부딪힘II
}
/* 부딪힘: 맞으면 빠르게 밀려나고(밥상·포크 1.5초 / 제리얌 몸통 박치기 1초), 벽에 부딪힐 때마다 JY.wallDmg(3) 데미지 (제리얌은 면역). 별도의 '당했다' 글자 표시는 없음 */
const debImmune=t=>!!t&&t.kind==='st';   // 숏타민: 요력면역(부딪힘을 뺀 모든 디버프 면역)
const ST={max:2,cell:7.5};               // 숏타민 회피 게이지: 2칸, 칸마다 7.5초
function playDodge(){               // 회피 효과음: 짧게 스치는 '슉'
  if(!actx||actx.state!=='running')return;
  try{
    const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.setValueAtTime(1500,t);o.frequency.exponentialRampToValueAtTime(500,t+.14);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.17);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+.2);
  }catch(e){}
}
function stDodge(c){                // 데미지를 입으면 게이지 1칸을 쓰고 그 데미지를 피함
  if((c.stG||0)<1-1e-9)return false;
  c.stG=Math.max(0,c.stG-1);
  try{
    playDodge();
    c.ball.animate([{opacity:.3},{opacity:.3,offset:.25},{opacity:1}],{duration:500,easing:'ease-out'});   // 회피: 맞는 즉시 연해졌다가 0.5초 만에 원래대로
  }catch(e){}
  return true;
}
function stTick(dt){
  for(const c of chars){
    if(c.kind!=='st'||!c.alive||!c.started)continue;
    if(!c.frozen&&!(revPause>0))c.stG=Math.min(ST.max,(c.stG||0)+dt/ST.cell);
    if(c.fill)c.fill.style.transform='scaleX('+((c.stG||0)/ST.max)+')';
  }
}
function applyKnock(t,dx,dy,sec,lvl){
  if(t.immune)return false
  sec=sec||JY.knockSec;
  const lv=lvl||1,wd=lv>=2?JY.wallDmg2:JY.wallDmg;                    // 부딪힘 = 벽 충돌 3 / 부딪힘II = 8 / 부딪힘III = 8 + 캐릭터와 부딪혀도 8
  t.kbWall=(t.kbUntil>now)?Math.max(t.kbWall||0,wd):wd;                // 이미 걸려 있으면 더 센 쪽 유지
  t.kbLvl=(t.kbUntil>now)?Math.max(t.kbLvl||1,lv):lv;
  const l=Math.hypot(dx,dy)||1;t.vx=dx/l;t.vy=dy/l;t.kbUntil=now+sec;t.kbDur=sec;
  return true;
}
function jyBump(a,b){               // 제리얌과 몸이 부딪힌 상대: 5 데미지 + 부딪힘 1초. 이미 부딪힘 중이어도 또 닿으면 남은 시간이 1초로 다시 시작되고 또 튕겨 나감
  for(const [s,t] of [[a,b],[b,a]]){
    if(s.kind!=='jy'||!s.alive||!t.alive||lostPas(s))continue;
    if(now<(t.bumpCd||0))continue;
    t.bumpCd=now+JY.bumpCd;
    const W=arenaEl.clientWidth,H=arenaEl.clientHeight;
    playThud(.7);burstAt((s.x+t.x)/2*W,(s.y+t.y)/2*H,'#ffd24a',.8,7);shake(4,170);
    hurt(t,(JY.bumpDmg+atk(s))*frail(s));
    if(t.alive)applyKnock(t,t.x-s.x,t.y-s.y,JY.bumpSec);
  }
}
const BKD={take:7,cd:HIT_GUARD};   // 백기철 판타지의 체력 베끼기: 몸이 부딪힌 상대의 체력 15를 베껴 그만큼 회복
function playDrain(){               // 체력 베끼기 효과음: 짧게 빨려 들어오는 '츄릅'
  if(!actx||actx.state!=='running')return;
  try{
    const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type='triangle';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(1100,t+.16);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+.25);
  }catch(e){}
}
function drainFx(from,to){          // 상대에게서 백기철 쪽으로 파란 점들이 빨려 들어감
  try{
    playDrain();
    const W=arenaEl.clientWidth,H=arenaEl.clientHeight,d=to.ball.offsetWidth||40;
    const x1=from.x*W,y1=from.y*H,x2=to.x*W,y2=to.y*H;
    for(let i=0;i<6;i++){
      const p=mk('pct','');p.style.cssText+=';width:7px;height:7px;border-radius:50%;background:'+(i%2?'#5aa9ff':'#a8d2ff')+';font-size:0';
      const ox=(Math.random()*2-1)*d*.4,oy=(Math.random()*2-1)*d*.4;
      p.style.left=x1+'px';p.style.top=y1+'px';
      p.animate([{opacity:0,transform:'translate(calc(-50% + '+ox+'px),calc(-50% + '+oy+'px)) scale(.6)'},
        {opacity:1,offset:.2},
        {opacity:0,transform:'translate(calc(-50% + '+(x2-x1)+'px),calc(-50% + '+(y2-y1)+'px)) scale(.4)'}],
        {duration:380+Math.random()*120,delay:i*25,easing:'ease-in',fill:'forwards'}).onfinish=()=>p.remove();
    }
    const ring=mk('pring','');ring.style.borderColor='#5aa9ff';
    const rf=follow(ring,to,0);rf.keep=true;

function bkDrain(a,b){              // 백기철 판타지와 몸이 부딪힌 상대: 체력 15를 잃고(보호로 줄어든 만큼만), 백기철이 실제로 잃은 만큼 회복. 다른 데미지로는 회복하지 않음

/* 포크: 머리 위에서 내려찍고, 75% → 65% → 40% → 20% 확률을 뚫을 때마다 다시 찍음 (최대 5번) */
function pierceFx(t,p,k){          // 확률을 뚫었을 때: 효과음 + 이펙트 (글자 표시는 없음)
  playPierce(k);

}
function sFork(c,done){
  {const d0=done;done=()=>{try{d0()}finally{skillEnded(c,'fork')}}}
  const t=foe(c);
  if(!t){sched(.5,done);return}
  const el=mk('fork',FORK_SVG),f=follow(el,t,0);
  const schedF=(d,fn)=>sched(d,fn,true);
  const HOV=-(R+.22),HIT=-.015;
  let phase='appear',t0=now,fin=false;
  f.pause=dt=>{t0+=dt};                                             // 꼼짝마 동안 포크 동작 시간도 정지
  f.dy=HOV-.12;el.style.opacity=0;
  f.upd=()=>{
    const e=now-t0;
    if(phase==='appear'){const u=Math.min(1,e/.3);f.dy=HOV-.12*(1-easeOut(u));el.style.opacity=u}
    else if(phase==='hover'){f.dy=HOV+Math.sin(e*18)*.004}
    else if(phase==='slam'){const u=Math.min(1,e/.09);f.dy=HOV+(HIT-HOV)*u*u}
    else if(phase==='stuck'){f.dy=HIT+Math.sin(e*60)*.003*Math.max(0,1-e/.4)}
    else if(phase==='rise'){const u=Math.min(1,e/.3);f.dy=HIT+(HOV-HIT)*easeOut(u)}
    else if(phase==='leave'){const u=Math.min(1,e/.3);f.dy=HOV-.15*u;el.style.opacity=1-u}
  };
  const go=ph=>{phase=ph;t0=now};
  const finish=()=>{if(fin)return;fin=true;unfollow(f);done()};
  const slam=k=>{go('slam');schedF(.09,()=>hit(k))};
  const hit=k=>{
    go('stuck');
    const dmg=JY.forkDmg+(k===5?JY.forkExtra:0);
    let applied=false;
    try{if(c.alive&&t.alive){hurt(t,(dmg+atk(c))*frail(c));applied=true}}catch(e){console.error(e)}      // 데미지를 먼저 확실히 적용
    const W=arenaEl.clientWidth,H=arenaEl.clientHeight;
    playStab();burstAt(t.x*W,t.y*H,k===5?'#ff3b30':'#ffffff',1+.12*k,10);shake(8+k,280);
    if(applied&&k===5&&t.alive)applyKnock(t,(Math.random()<.5?-1:1)*.35,1);            // 20%를 뚫은 마지막 포크는 +10 데미지 + 부딪힘
    if(k===5){schedF(.55,()=>{go('leave');schedF(.3,finish)});return}
    schedF(.45,()=>roll(k));
  };
  const roll=k=>{
    const p=JY.forkOdds[k-1];
    if(!(c.alive&&t.alive)){finish();return}
    if(Math.random()<p){pierceFx(t,p,k);go('rise');schedF(.3,()=>go('hover'));schedF(.5,()=>slam(k+1))}
    else{go('leave');schedF(.3,finish)}
  };
  schedF(.3,()=>go('hover'));
  schedF(.55,()=>slam(1));
}
function castJy(c){                 // 햄버거 30% / 치킨 30% / 야채 20% / 포크 20%
  if(!foe(c)){c.gauge=0;return}
  const r=Math.random();
  if(r<.8){spawnFood(c,r<.3?'burger':(r<.6?'chicken':'veg'));c.gauge=0;return}
  c.mode='cast';c.skillT=now;
  const end=()=>{if(c.alive&&c.mode==='cast'){c.gauge=0;c.mode='fill'}};
  try{sFork(c,end)}catch(e){console.error(e);end()}
}

/* ---------- 태권히어로: 아우라 + 주먹 ---------- */
/* 아우라: 몸 가장자리에서 4m 바깥까지. 상대 몸이 아우라에 닿으면(두 공 사이 간격 4m 이내) 주먹이 나감 */
const RESIST={cut:.3,cut2:.5,cut3:.7};   // 보호 30% / 보호II 50% / 보호III 70% 감소
const NU={spin:60,aura:.06,hit:5,ult:50,gap:.3,need:5,sec:1,ultSec:2.5,p1:.9,col3:8,colCd:HIT_GUARD,cycle:5,offSec:1.5,fade:.4,fxSec:3};

const TRI_LINES={geon:'SSS',gon:'BBB',gam:'BSB',ri:'SBS'};              // 건☰ 곤☷ 감☵ 리☲ (위→아래, S=이어진 줄 / B=끊어진 줄)
/* 태극기 규격: 가로:세로=3:2. 괘는 가로세로 대각선(수평에서 33.69°) 위에, 줄은 중심 방향에 수직(56.31°)으로 놓임.
   태극은 -56.31° 돌려서 빨강이 건(왼위) 쪽, 파랑이 곤(오른아래) 쪽을 봄. 태극 반지름 12 : 괘 중심 거리 21 : 줄 길이 12 : 줄 두께 2 : 줄 사이 2 */
const FLAG_ANG=Math.atan(2/3),TG_DEG=+(FLAG_ANG*180/Math.PI).toFixed(2),FLAG_DEG=+(90-TG_DEG).toFixed(2);   // 태극 기울기 33.69° (시계방향) · 괘 줄 기울기 56.31°
const FLAG_DX=+(87.5*Math.cos(FLAG_ANG)).toFixed(3),FLAG_DY=+(87.5*Math.sin(FLAG_ANG)).toFixed(3);   // 태극 반지름 50 기준 괘 중심 위치 (87.5 = 21/12×50)
const TRI_POS=[['geon',-1,-1,-FLAG_DEG],['gon',1,1,-FLAG_DEG],['gam',1,-1,FLAG_DEG],['ri',-1,1,FLAG_DEG]];   // 건 왼위 · 곤 오른아래 · 감 오른위 · 리 왼아래
const triSvgGroup=(k,sc)=>{sc=sc||1;const L=50*sc,T=50/6*sc;return TRI_LINES[k].split('').map((ch,i)=>{const y=((i-1)*2*T-T/2).toFixed(2);
  return ch==='S'?"<rect x='"+(-L/2).toFixed(2)+"' y='"+y+"' width='"+L.toFixed(2)+"' height='"+T.toFixed(2)+"'/>"
    :"<rect x='"+(-L/2).toFixed(2)+"' y='"+y+"' width='"+((L-T)/2).toFixed(2)+"' height='"+T.toFixed(2)+"'/><rect x='"+(T/2).toFixed(2)+"' y='"+y+"' width='"+((L-T)/2).toFixed(2)+"' height='"+T.toFixed(2)+"'/>"}).join('')};
const FLAG_SVG=()=>"<svg viewBox='-120 -120 240 240' aria-hidden='true'>"+TG_ROT+"<g fill='#151515'>"+TRI_POS.map(([k,sx,sy,r])=>"<g transform='translate("+(sx*FLAG_DX).toFixed(3)+","+(sy*FLAG_DY).toFixed(3)+") rotate("+r.toFixed(2)+")'>"+triSvgGroup(k,1)+"</g>").join('')+"</g></svg>";
const TG_BODY="<path d='M-50,0A50,50 0 0 1 50,0Z' fill='"+TG_RED+"'/><path d='M50,0A50,50 0 0 1 -50,0Z' fill='"+TG_BLUE+"'/><circle cx='25' cy='0' r='25' fill='"+TG_BLUE+"'/><circle cx='-25' cy='0' r='25' fill='"+TG_RED+"'/>";   // 위=빨강 · 아래=파랑, 작은 원 두 개가 서로 파고든 태극
const TG_ROT="<g class='tgrot' transform='rotate("+TG_DEG+")'>"+TG_BODY+"</g>";            // 태극기와 똑같이 기울어진 태극
const ORBIT_SVG=[0,1,2,3,4,5].map(i=>{const a=i*Math.PI/3,x=(54*Math.cos(a)).toFixed(1),y=(54*Math.sin(a)).toFixed(1);return "<path transform='translate("+x+","+y+")' d='M0,-3.6L1.3,-1.3L3.6,0L1.3,1.3L0,3.6L-1.3,1.3L-3.6,0L-1.3,-1.3Z' fill='"+(i%2?TG_BLUE:TG_RED)+"' stroke='#fff' stroke-width='.9'/>"}).join('');
const AURA_SVG="<svg class='tgglow' viewBox='-50 -50 100 100' aria-hidden='true'>"+TG_ROT+"</svg>"           // 뒤에 번지는 홍·청 빛
  +"<svg class='tg' viewBox='-50 -50 100 100' aria-hidden='true'>"+TG_ROT+"<circle r='48.8' fill='none' stroke='#111' stroke-width='2.2'/></svg>"   // 굵은 검은 테두리의 태극
  +"<svg class='tri' viewBox='-100 -100 200 200' aria-hidden='true'><g fill='#151515'>"+TRI_POS.map(([k,sx,sy,r])=>"<g transform='translate("+(sx*FLAG_DX).toFixed(3)+","+(sy*FLAG_DY).toFixed(3)+") rotate("+r.toFixed(2)+")'>"+triSvgGroup(k,.5)+"</g>").join('')+"</g></svg>";
function tgSide(n,t){               // 상대 몸이 닿은 태극 구역: 상대 몸에서 아우라 중심에 가장 가까운 점이 빨강/파랑 중 어디인지 (태극 방향은 고정)
  const dx=t.x-n.x,dy=t.y-n.y,d=Math.hypot(dx,dy)||1e-6,aR=R+NU.aura;
  const rho=Math.min(1,Math.max(0,d-R)/aR),sx=dx/d*rho,sy=dy/d*rho;    // 아우라 반지름을 1로 본 좌표 (y는 아래쪽이 +)
  const tr=(n.tgAng==null?TG_DEG:n.tgAng)*Math.PI/180,x=sx*Math.cos(tr)+sy*Math.sin(tr),y=-sx*Math.sin(tr)+sy*Math.cos(tr);   // 기울어진 태극을 바로 세운 좌표로 바꿔서 구역 판정
  const inR=Math.hypot(x-.5,y)<.5,inL=Math.hypot(x+.5,y)<.5;
  return y<0?(inR?'blue':'red'):(inL?'red':'blue');
}
function applySlow(t,lvl,sec){      // 슬로우(×.5) / 슬로우II(×.25): 겹치지 않고 더 센 쪽이 적용, 시간은 더 긴 쪽으로
  if(debImmune(t))return;
  const mul=lvl>=2?SLOW.mul2:SLOW.mul,until=now+sec;
  if(t.slowUntil>now){t.slowMul=Math.min(t.slowMul||1,mul);t.slowUntil=Math.max(t.slowUntil,until)}
  else{t.slowMul=mul;t.slowUntil=until}

function applyBurn(t,lvl,sec){          // 연소 3초: 이미 타는 중이면 더 센 쪽 + 시간 갱신 (0.5초 틱 간격은 그대로 이어감)
  if(debImmune(t))return;
  const until=now+(sec||NU.fxSec);
  if(t.burnUntil>now){t.burnLvl=Math.max(t.burnLvl||1,lvl);t.burnUntil=Math.max(t.burnUntil,until)}
  else{t.burnLvl=lvl;t.burnUntil=until;t.burnNext=now+BURN.gap}

/* ---------- main loop ---------- */
function tick(t){
  let ok=true;
  try{tickBody(t)}catch(e){ok=false;console.error(e)}

}
function placeOutside(mv,f){          // 멈춘 공(f) 바깥으로 mv를 옮기되, 벽에 막히면 벽을 따라 미끄러지게
  let dx=mv.x-f.x,dy=mv.y-f.y,d=Math.hypot(dx,dy);
  if(d>=2*R)return;
  if(d===0){dx=1;dy=0;d=1}
  const lo=RW,hi=1-RW;
  let x=f.x+dx/d*2*R,y=f.y+dy/d*2*R;
  if(x<lo||x>hi){x=Math.min(hi,Math.max(lo,x));y=f.y+(dy>=0?1:-1)*Math.sqrt(Math.max(0,4*R*R-(x-f.x)*(x-f.x)))}
  else if(y<lo||y>hi){y=Math.min(hi,Math.max(lo,y));x=f.x+(dx>=0?1:-1)*Math.sqrt(Math.max(0,4*R*R-(y-f.y)*(y-f.y)))}
  mv.x=Math.min(hi,Math.max(lo,x));mv.y=Math.min(hi,Math.max(lo,y));
}
function separate(a,b){               // 위치만 떼어내기 (속도는 건드리지 않음)
  let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
  if(d>=2*R)return;
  if(d===0){dx=1;dy=0;d=1}
  const nx=dx/d,ny=dy/d,ov=2*R-d,af=a.frozen>0,bf=b.frozen>0;
  if(af&&bf)return;
  if(af)placeOutside(b,a);
  else if(bf)placeOutside(a,b);
  else{a.x-=nx*ov/2;a.y-=ny*ov/2;b.x+=nx*ov/2;b.y+=ny*ov/2}
}
/* 튕기는 방향 보정: 벽·공에 부딪힐 때마다 방향을 아주 조금 흔들고(±jit도), 가로·세로 축에 너무 가까운 각도는 피해서 같은 길만 영원히 왔다 갔다 하는 일이 없게 한다 */
const MIN_ANG=14*Math.PI/180;
function fixDir(m,jit){
  let th=Math.atan2(m.vy,m.vx)+(Math.random()*2-1)*jit*Math.PI/180;
  const q=Math.floor(th/(Math.PI/2)),a=th-q*Math.PI/2;                     // 현재 사분면 안에서의 각도 (0~90°)
  const a2=Math.min(Math.PI/2-MIN_ANG,Math.max(MIN_ANG,a));
  th=q*Math.PI/2+a2;m.vx=Math.cos(th);m.vy=Math.sin(th);
}
let lastMeet=0;                       // 마지막으로 공끼리 부딪힌 시각
function tickBody(t){
  let dt=Math.max(0,(t-last)/1000);last=t;if(dt>.25)dt=.25;   // 프레임이 늦어져도 실제 시간 기준 (탭 복귀 때만 제한)
  now+=dt;

  }
  if(revPause>0)for(const ev of events)if(!ev.rev&&!ev.obj)ev.t+=dt;   // 부활 연출 중에는 진행 중이던 스킬 일정도 전부 정지 (스킬이 새로 써지지 않음)
  events.sort((a,b)=>a.t-b.t);
  while(events.length&&events[0].t<=now){const ev=events.shift();try{ev.fn()}catch(err){console.error(err)}events.sort((a,b)=>a.t-b.t)}
  if(over){raf=0;return}

  const steps=Math.max(1,Math.ceil(dt/.006)),h=dt/steps;
  for(let st=0;st<steps;st++){
  for(const m of movers){
    if(m.frozen>0)continue;
    if(!isFinite(m.x+m.y))m.x=m.y=.5;if(!isFinite(m.vx+m.vy)){m.vx=1;m.vy=0}
    const l=Math.hypot(m.vx,m.vy)||1;m.vx/=l;m.vy/=l;                   // 방향 벡터는 항상 크기 1
    const kb=m.kbUntil>now;                                              // 부딪힘(넉백) 중이면 처음엔 빠르게, 점점 원래 속도로
    const sp=bhBaseSpeed(m)*(m.buffUntil>now?m.buffMul:1)*(m.slowUntil>now?(m.slowMul||SLOW.mul):1)+(kb?JY.knockSpeed*Math.min(1,(m.kbUntil-now)/m.kbDur):0);
    m.spNow=sp;
    m.x+=m.vx*sp*h;m.y+=m.vy*sp*h;

    let wh=false;

    if(m.y<RW){m.y=Math.min(1-RW,2*RW-m.y);m.vy=Math.abs(m.vy);playHit();wh=true}else if(m.y>1-RW){m.y=Math.max(RW,2*(1-RW)-m.y);m.vy=-Math.abs(m.vy);playHit();wh=true}
    if(wh){fixDir(m,4);if(kb)knockWall(m)}
  }
  for(let i=0;i<movers.length;i++)for(let j=i+1;j<movers.length;j++){
    const a=movers[i],b=movers[j];
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d>=2*R)continue;
    if(d===0){dx=1;dy=0;d=1}
    const nx=dx/d,ny=dy/d,ov=2*R-d;
    if(a.frozen>0&&b.frozen>0)continue;
    if(a.frozen>0||b.frozen>0){          // 멈춘 공은 그대로, 움직이는 공만 튕김
      const mv=a.frozen>0?b:a,sg=a.frozen>0?1:-1;
      placeOutside(mv,a.frozen>0?a:b);
      const vn=mv.vx*sg*nx+mv.vy*sg*ny;
      if(vn<0){mv.vx-=2*vn*sg*nx;mv.vy-=2*vn*sg*ny;fixDir(mv,2);lastMeet=now;playHit();jyBump(a,b);bkDrain(a,b);kbCollide(mv)}
      continue;
    }
    const push=ov/2;
    a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push;
    const vn=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
    const ka=a.kbUntil>now,kb2=b.kbUntil>now;
    if(ka||kb2){                          // 부딪힘 중인 공은 상대를 통과하지 않고 튕겨 나옴
      let hit=false;
      if(ka){const dn=a.vx*nx+a.vy*ny;if(dn>0){a.vx-=2*dn*nx;a.vy-=2*dn*ny;hit=true}}
      if(kb2){const dn=-(b.vx*nx+b.vy*ny);if(dn>0){b.vx+=2*dn*nx;b.vy+=2*dn*ny;hit=true}}
      if(hit){fixDir(a,2);fixDir(b,2);lastMeet=now;playHit();jyBump(a,b);bkDrain(a,b);kbCollide(a);kbCollide(b);continue}
    }
    const sa=a.spNow||1,sb=b.spNow||1;                               // 실제 속도까지 포함해서 가까워지는 중인지 판단 (같은 방향으로 빠른 공이 느린 공을 쫓아갈 때도 부딪힘으로 처리)
    const closing=(a.vx*sa-b.vx*sb)*nx+(a.vy*sa-b.vy*sb)*ny;
    if(vn>0||closing>0){
      if(vn>0){a.vx-=vn*nx;a.vy-=vn*ny;b.vx+=vn*nx;b.vy+=vn*ny}
      const SEP=.4;                                                  // 부딪힌 뒤에는 반드시 서로 멀어지는 쪽으로 나아가게 (붙어서 두두두 하며 같이 가지 않게)
      const da=a.vx*nx+a.vy*ny;if(da>-SEP){const k=-SEP-da;a.vx+=k*nx;a.vy+=k*ny}
      const db=b.vx*nx+b.vy*ny;if(db<SEP){const k=SEP-db;b.vx+=k*nx;b.vy+=k*ny}
      for(const m of [a,b]){const l=Math.hypot(m.vx,m.vy)||1;m.vx/=l;m.vy/=l;fixDir(m,2)}

    }
  }
  for(let it=0;it<6;it++){                // 벽에 눌린 공도 겹치지 않게: 벽 안으로 되돌리고 → 다시 떼어내기를 반복
    for(const m of movers){m.x=Math.min(1-RW,Math.max(RW,m.x));m.y=Math.min(1-RW,Math.max(RW,m.y))}
    for(let i=0;i<movers.length;i++)for(let j=i+1;j<movers.length;j++)separate(movers[i],movers[j]);
  }

  for(const c of chars){               // 안전장치: 정지/스킬 상태가 비정상적으로 오래 가면 풀어줌
    if(!c.alive)continue;
    if(c.frozen>0){c.fz=(c.fz||0)+dt;if(c.fz>8){c.frozen=0;c.fz=0}}else c.fz=0;
    if(c.mode==='cast'&&now-c.skillT>12){c.mode='fill';c.gauge=0}
    if(c.mode==='chain'&&now-c.chainT>40){endBoostUI(c);c.mode='fill';c.gauge=0}
  }
  for(const c of chars){               // skill gauge
    if((c.kind!=='nm'&&c.kind!=='jy'&&c.kind!=='kk')||!c.alive||!c.started)continue;
    if(c.mode==='fill'){

    }

  }

  const W=arenaEl.clientWidth,H=arenaEl.clientHeight;
  renderProjs(dt,W,H);
  for(const f of follows){
    if(f.upd)f.upd();
    let x=f.obj.x*W,y=(f.obj.y+f.dy)*H;
    if(f.clamp){const hw=f.el.offsetWidth/2,h=f.el.offsetHeight;x=Math.min(W-hw-2,Math.max(hw+2,x));y=Math.max(h+2,y)}
    f.el.style.left=x+'px';f.el.style.top=y+'px';
  }
  for(const c of chars){               // 머리 위 스킬 글자: 1.75초 따라다니다 페이드 아웃
    c.tags=c.tags.filter(tg=>{if(now-tg.t0>=1.75){tg.el.remove();return false}return true});
    c.signH=c.sign?c.sign.offsetHeight+2:0;
    let yy=(c.y-R-.012)*H-c.signH;

}

  if(b&&foe(b)===c)bkReact(b,c,id);
}
function bkReact(b,src,id){
  if(revPause>0||b.copyId||b.g<1||!BK_CAST[id])return;       // 이미 베끼는 중이면 발동하지 않음
  b.g=Math.max(0,b.g-1);                                       // 게이지 1칸 사용
  if(b.silenceUntil>now){burstAt(b.x*arenaEl.clientWidth,b.y*arenaEl.clientHeight,'#9aa0a6',.5,4);return}   // 스킬 실패: 게이지만 사라짐
  b.copyId=id;b.copyT=now;
  b.ball.style.backgroundImage='var(--img-'+src.kind+')';bkName(b,BK.name);
  burstAt(b.x*arenaEl.clientWidth,b.y*arenaEl.clientHeight,'#2563eb',.8,8);

function bkFlash(c,k){               // 한 칸이 다 찰 때마다 그 칸에 반짝이는 표시
  try{
    const el=document.createElement('s');el.className='bkflash';
    el.style.left=(k/BK.max*100)+'%';el.style.width=(100/BK.max)+'%';(c.bkBar||c.rb).append(el);

}
const BK_DEB=[['slow',14],['frail',12],['burn',12],['nopas',9],['silence',9],['slow2',6],['burn2',5]];
const BK_DEBN={slow:'슬로우',slow2:'슬로우II',burn:'연소',burn2:'연소II',frail:'빈약함',nopas:'패시브 상실',silence:'스킬 실패'};   // 센 디버프일수록 확률이 낮음
function bkDebuff(b){                 // 상대에게 아무 디버프나 BK.debSec초 동안 (단계 구분 없이, 센 것일수록 드물게)
  const t=foe(b);if(!t||!t.alive||debImmune(t))return false;const D=BK.debSec;
  for(let tr=0;tr<6;tr++){
    let r=Math.random()*BK_DEB.reduce((a,x)=>a+x[1],0),k=BK_DEB[0][0];
    for(const [n,w] of BK_DEB){if(r<w){k=n;break}r-=w}
    if(k==='slow')applySlow(t,1,D);else if(k==='slow2')applySlow(t,2,D);
    else if(k==='burn')applyBurn(t,1,D);else if(k==='burn2')applyBurn(t,2,D);
    else if(k==='frail')t.frailUntil=now+D;
    else if(k==='nopas')t.noPasUntil=now+D;
    else if(k==='silence'){t.silenceUntil=Math.max(t.silenceUntil||0,now+D)}
    b.dbName=BK_DEBN[k];
    burstAt(t.x*arenaEl.clientWidth,t.y*arenaEl.clientHeight,'#2563eb',.8,8);return true;
  }
  return false;
}
function bkMirror(b){                 // 상대가 가진 이로운 효과(이동속도 증가·힘·보호)를 똑같이 얻음. 디버프는 따라하지 않음
  const o=foe(b);if(!o||lostPas(b))return;
  if(o.buffUntil>now){if(!(b.buffUntil>now))addSpeedBuff(b,o.buffMul,o.buffUntil-now);else{b.buffMul=Math.max(b.buffMul||1,o.buffMul);b.buffUntil=Math.max(b.buffUntil,o.buffUntil)}}
  if(o.strUntil>now){if(!(b.strUntil>now))b.ball.classList.add('strong');b.strUntil=Math.max(b.strUntil,o.strUntil)}
}
function bkTick(dt){
  for(const c of chars){
    if(c.kind!=='bk'||!c.alive||!c.started)continue;
    if(!c.frozen&&!(revPause>0))c.g=Math.min(BK.max,c.g+dt/BK.cell);
    bkMirror(c);
    if(c.dbFill){                                              // 디버프 게이지: 18초 동안 차오르고, 다 차면 디버프 5초 동안 도로 줄어들며 가운데에 걸린 디버프 이름 표시
      const on=c.dbEnd>now;
      c.dbFill.style.transform='scaleX('+(on?Math.max(0,Math.min(1,(c.dbEnd-now)/BK.debSec)):Math.min(1,c.dbT/BK.dbGap))+')';
      const tx=on?(c.dbName||''):'';if(c.dbTxt.textContent!==tx)c.dbTxt.textContent=tx;
    }
    if(!c.frozen&&!(revPause>0)){                              // 18초마다 디버프 (디버프가 걸려 있는 동안은 시간이 흐르지 않고, 정지 중에도 안 흐름)
      if(c.dbEnd>now){}else{c.dbEnd=0;c.dbT+=dt;if(c.dbT>=BK.dbGap){c.dbT=0;if(c.silenceUntil>now)burstAt(c.x*arenaEl.clientWidth,c.y*arenaEl.clientHeight,'#9aa0a6',.5,4);else if(bkDebuff(c))c.dbEnd=now+BK.debSec}}
    }
    c.fill.style.transform='scaleX('+(c.g/BK.max)+')';
    const n=Math.floor(c.g+1e-9);if(c.cells===undefined)c.cells=n;if(n>c.cells)bkFlash(c,n-1);c.cells=n;
    if(c.copyId&&now-c.copyT>BK.guard)bkRevert(c);
  }
}

(function(){
  const vt=document.getElementById('vtag');if(vt)vt.textContent='v'+PATCH_VERSION;
  const TAGS={nerf:'너프',buff:'버프',adj:'조정',rework:'리워크',new:'신규'};
  const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const fmt=t=>esc(t).replace(/\{([+\-~])([^}]*)\}/g,(m,k,x)=>'<b class="pc'+({'+':'g','-':'r','~':'y'}[k])+'">'+x+'</b>');   // {+좋아짐} 초록 · {-나빠짐} 빨강 · {~조정} 노랑
  const nn=(ls,c)=>(ls.join('\n').match(new RegExp('\\{\\'+c,'g'))||[]).length;
  const autoTag=it=>{if(it.tag==='new'||it.tag==='rework')return it.tag;const v={buff:nn(it.lines,'+'),nerf:nn(it.lines,'-'),adj:nn(it.lines,'~')},d=Math.abs(v.buff-v.nerf),tol=Math.max(v.buff,v.nerf)>12?2:1;if(v.adj<Math.min(v.buff,v.nerf)&&d<=tol)return 'adj';const m=Math.max(v.buff,v.nerf,v.adj),w=Object.keys(v).filter(k=>v[k]===m);return w.length===1?w[0]:'adj'};   // 태그는 줄 색 개수가 가장 많은 쪽 (같으면 조정)
  const cnt=ls=>{const t=ls.join('\n'),n=c=>nn(ls,c),g=n('+'),r=n('-'),y=n('~'),o=[];
    if(g)o.push('<b class="pcg">버프 '+g+'</b>');if(r)o.push('<b class="pcr">너프 '+r+'</b>');if(y)o.push('<b class="pcy">조정 '+y+'</b>');
    return o.length?'<span class="pncnt">('+o.join(' · ')+')</span>':''};   // 그 캐릭터의 버프·너프·조정 개수
  const items=a=>a.length?[...a].sort((x,y)=>(autoTag(y)==='new')-(autoTag(x)==='new')).map(it=>'<div class="pnitem"><div class="pnname">'+esc(it.who)+'<span class="pntag '+autoTag(it)+'">'+TAGS[autoTag(it)]+'</span>'+cnt(it.lines)+'</div><ul>'+it.lines.map(l=>'<li>'+fmt(l)+'</li>').join('')+'</ul></div>').join(''):'<div class="pnnone">변경 사항 없음</div>';
  const body=document.getElementById('pnbody'),modalEl=document.getElementById('pnmodal');
  if(!body||!modalEl)return;
  body.innerHTML=PATCH_NOTES.map(v=>'<section class="pnver"><div class="pnvh"><b>v'+v.ver+'</b>'+(v.hot?'<i>긴급패치</i>':'')+'<span>'+(v.date||'')+'</span></div>'
    +'<div class="pnsec">캐릭터</div>'+items(v.chars||[])
    +'<div class="pnsec">상태효과</div>'+items(v.fx||[])
    +'<div class="pnsec">시스템</div>'+((v.sys&&v.sys.length)?v.sys.filter(l=>typeof l==='object').map(o=>'<div class="pnitem"><div class="pnname">'+esc(o.who)+'</div><ul>'+o.lines.map(l=>'<li>'+fmt(l)+'</li>').join('')+'</ul></div>').join('')+(v.sys.some(l=>typeof l==='string')?'<ul class="pnsys">'+v.sys.filter(l=>typeof l==='string').map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>':''):'<div class="pnnone">변경 사항 없음</div>')
    +'</section>').join('');
  const open=()=>{modalEl.hidden=false;document.querySelector('.pnpanel').scrollTop=0},close=()=>{modalEl.hidden=true};
  document.getElementById('pnbtn').addEventListener('click',open);
  document.getElementById('pnclose').addEventListener('click',close);
  modalEl.addEventListener('click',e=>{if(e.target===modalEl)close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modalEl.hidden)close()});
})();

btn.addEventListener('click',()=>{
  if(phase!=='idle')return;

  btn.hidden=true;endBtn.hidden=false;

  const seq=['3','2','1','시작!'];
  seq.forEach((s,i)=>later(()=>{count.textContent=s},i*1000));
  phase='count';document.querySelectorAll('.ball').forEach(spin);
  later(()=>{phase='freeze';document.querySelectorAll('.ball').forEach(freezeAim)},3000);
  later(()=>{phase='run';document.querySelectorAll('.ball').forEach(release)},3350);
  later(()=>{count.textContent=''},seq.length*1000);

const openM=()=>{modal.hidden=false},closeM=()=>{modal.hidden=true};
document.addEventListener('click',e=>{

});
document.querySelector('.panel').addEventListener('click',e=>{
  const o=e.target.closest('.half');if(!o||!side||phase!=='idle'||chars.some(c=>c.side===side))return;
  if(o.dataset.locked&&!stOpen){askCode(()=>{o.removeAttribute('data-locked');const lk=o.querySelector('.lk');if(lk)lk.remove();o.click()});return}

  ball.className='ball '+side+(o.dataset.dummy?' dummy':'')+' '+(o.dataset.cls||'');
  ball.innerHTML='<div class="aim"><i></i></div>';arenaEl.appendChild(ball);
  makeChar(side,o,ball);
  const P=document.querySelector(side==='left'?'.p1':'.p2'),box=P.querySelector('.name'),n=document.createElement('span');
  box.innerHTML='';n.className='pname'+(o.dataset.dummy?' sys':'')+' '+(o.dataset.cls||'');n.textContent=o.dataset.name;box.appendChild(n);
  const rm=document.createElement('button');rm.type='button';rm.className='rm';rm.textContent='−';rm.setAttribute('aria-label','캐릭터 빼기');
  if(side==='left')box.append(rm);else box.prepend(rm);      // 이름 안쪽(가운데 쪽)에 표시
  P.classList.add('on');

});
function resetGame(){
  timers.forEach(clearTimeout);timers.length=0;

  document.querySelectorAll('.ball').forEach(b=>{if(b._anim)b._anim.cancel();b.remove()});
  cancelAnimationFrame(barRaf);barRaf=0;bhs.forEach(bhHumKill);bhSprayUpdate(-1);chars=[];movers=[];events=[];follows=[];foods=[];projs=[];bhs=[];mletters=[];now=0;lastMeet=0;over=false;objStop=0;if(shakeAnim){shakeAnim.cancel();shakeAnim=null}fx.innerHTML='';auraLayer.innerHTML='';
  used.length=0;side=null;phase='idle';modal.hidden=true;count.textContent='';count.classList.remove('win');count.getAnimations().forEach(a=>a.cancel());
  ['.p1','.p2'].forEach(k=>{

    p.classList.remove('on','bleeding');p.style.removeProperty('--nb');p.style.removeProperty('--tall');p.querySelector('.rb').classList.remove('tall');p.querySelector('.rb').innerHTML='';p.querySelector('.rail').classList.remove('boost','cells5');
    p.querySelector('.status').textContent='';hp.textContent='250 / 250';hp.style.setProperty('--g','100%');hp.style.setProperty('--l','100%');hp.style.setProperty('--r','100%');
    p.querySelector('.name').innerHTML='<button class="add" type="button">추가하기</button>';
  });
  btn.hidden=false;endBtn.hidden=true;
}
endBtn.addEventListener('click',resetGame);
modal.querySelector('.close').addEventListener('click',closeM);
modal.addEventListener('click',e=>{if(e.target===modal)closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev,initAudio,{passive:true}));   // 터치할 때마다 소리 잠금 해제/복구
setInterval(()=>{resumeAudio();audioHint()},1000);                      // 소리가 멈춰 있으면 1초마다 다시 시도
window.addEventListener&&['pageshow','focus'].forEach(ev=>window.addEventListener(ev,()=>{resumeAudio();audioHint()}));

document.addEventListener('visibilitychange',()=>{if(!document.hidden){last=performance.now();initAudio()}else{bhAudioOff();audioHint()}});
